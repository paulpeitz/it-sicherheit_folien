<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4CAF50"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e2001a"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2196F3"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">Netzwerksegmentierung im Smart Home</text>

  <!-- Internet Cloud -->
  <ellipse cx="450" cy="85" rx="100" ry="35" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="450" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">☁️ Internet</text>
  <text x="450" y="98" text-anchor="middle" font-size="10" fill="#555">Cloud-Dienste, Updates</text>

  <!-- Router/Firewall -->
  <rect x="350" y="145" width="200" height="65" rx="10" fill="#FFF3E0" stroke="#FF9800" stroke-width="2.5"/>
  <text x="450" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">🛡️ Router / Firewall</text>
  <text x="450" y="188" text-anchor="middle" font-size="10" fill="#666">VLAN-fähig · NAT · ACLs</text>

  <!-- Connection Internet → Router -->
  <line x1="450" y1="120" x2="450" y2="145" stroke="#2196F3" stroke-width="2"/>

  <!-- VLAN 1: Privat-Netz (links) -->
  <rect x="30" y="260" width="250" height="265" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="155" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">Privat-Netz (VLAN 10)</text>
  <text x="155" y="303" text-anchor="middle" font-size="10" fill="#555">Vertrauenswürdig</text>

  <rect x="50" y="318" width="95" height="50" rx="6" fill="#fff" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="97" y="340" text-anchor="middle" font-size="11" fill="#333">💻 PC</text>
  <text x="97" y="356" text-anchor="middle" font-size="9" fill="#777">Arbeit, Banking</text>

  <rect x="165" y="318" width="95" height="50" rx="6" fill="#fff" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="212" y="340" text-anchor="middle" font-size="11" fill="#333">📱 Smartphone</text>
  <text x="212" y="356" text-anchor="middle" font-size="9" fill="#777">Steuerung</text>

  <rect x="50" y="385" width="95" height="50" rx="6" fill="#fff" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="97" y="407" text-anchor="middle" font-size="11" fill="#333">💾 NAS</text>
  <text x="97" y="423" text-anchor="middle" font-size="9" fill="#777">Dokumente</text>

  <rect x="165" y="385" width="95" height="50" rx="6" fill="#fff" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="212" y="407" text-anchor="middle" font-size="11" fill="#333">🖨️ Drucker</text>
  <text x="212" y="423" text-anchor="middle" font-size="9" fill="#777">Netzwerkdruck</text>

  <rect x="50" y="450" width="210" height="30" rx="4" fill="#C8E6C9"/>
  <text x="155" y="470" text-anchor="middle" font-size="10" fill="#2E7D32">Voller Internetzugang</text>

  <!-- VLAN 2: IoT-Netz (Mitte) -->
  <rect x="325" y="260" width="250" height="265" rx="12" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="450" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">IoT-Netz (VLAN 20)</text>
  <text x="450" y="303" text-anchor="middle" font-size="10" fill="#555">Eingeschränkt</text>

  <rect x="345" y="318" width="95" height="50" rx="6" fill="#fff" stroke="#FF9800" stroke-width="1.5"/>
  <text x="392" y="340" text-anchor="middle" font-size="11" fill="#333">📷 IP-Kamera</text>
  <text x="392" y="356" text-anchor="middle" font-size="9" fill="#777">Überwachung</text>

  <rect x="460" y="318" width="95" height="50" rx="6" fill="#fff" stroke="#FF9800" stroke-width="1.5"/>
  <text x="507" y="340" text-anchor="middle" font-size="11" fill="#333">🌡️ Thermostat</text>
  <text x="507" y="356" text-anchor="middle" font-size="9" fill="#777">Heizung</text>

  <rect x="345" y="385" width="95" height="50" rx="6" fill="#fff" stroke="#FF9800" stroke-width="1.5"/>
  <text x="392" y="407" text-anchor="middle" font-size="11" fill="#333">🔊 Speaker</text>
  <text x="392" y="423" text-anchor="middle" font-size="9" fill="#777">Alexa, Google</text>

  <rect x="460" y="385" width="95" height="50" rx="6" fill="#fff" stroke="#FF9800" stroke-width="1.5"/>
  <text x="507" y="407" text-anchor="middle" font-size="11" fill="#333">💡 Lampen</text>
  <text x="507" y="423" text-anchor="middle" font-size="9" fill="#777">Hue, LIFX</text>

  <rect x="345" y="450" width="210" height="30" rx="4" fill="#FFE0B2"/>
  <text x="450" y="470" text-anchor="middle" font-size="10" fill="#E65100">Nur Cloud des Herstellers</text>

  <!-- VLAN 3: Gast-Netz (rechts) -->
  <rect x="620" y="260" width="250" height="265" rx="12" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="745" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Gast-Netz (VLAN 30)</text>
  <text x="745" y="303" text-anchor="middle" font-size="10" fill="#555">Isoliert</text>

  <rect x="660" y="330" width="190" height="50" rx="6" fill="#fff" stroke="#2196F3" stroke-width="1.5"/>
  <text x="755" y="353" text-anchor="middle" font-size="11" fill="#333">📱 Gast-Geräte</text>
  <text x="755" y="369" text-anchor="middle" font-size="9" fill="#777">Besucher-Smartphones</text>

  <rect x="660" y="400" width="190" height="50" rx="6" fill="#fff" stroke="#2196F3" stroke-width="1.5"/>
  <text x="755" y="423" text-anchor="middle" font-size="11" fill="#333">🎮 Unterhaltung</text>
  <text x="755" y="439" text-anchor="middle" font-size="9" fill="#777">Streaming, Gaming</text>

  <rect x="660" y="465" width="190" height="30" rx="4" fill="#BBDEFB"/>
  <text x="755" y="485" text-anchor="middle" font-size="10" fill="#1565C0">Nur Internet, kein LAN</text>

  <!-- Connections Router → VLANs -->
  <line x1="400" y1="210" x2="155" y2="258" stroke="#4CAF50" stroke-width="2"/>
  <line x1="450" y1="210" x2="450" y2="258" stroke="#FF9800" stroke-width="2"/>
  <line x1="500" y1="210" x2="745" y2="258" stroke="#2196F3" stroke-width="2"/>

  <!-- Firewall rules: Privat → IoT (allowed, one-way) -->
  <line x1="280" y1="350" x2="340" y2="350" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="310" y="340" text-anchor="middle" font-size="9" font-weight="bold" fill="#4CAF50">✓ Steuerung</text>

  <!-- Firewall rules: IoT → Privat (blocked) -->
  <line x1="340" y1="375" x2="285" y2="375" stroke="#e2001a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="310" y="395" text-anchor="middle" font-size="9" font-weight="bold" fill="#e2001a">✗ Blockiert</text>

  <!-- Firewall rules: IoT → Gast (blocked) -->
  <line x1="575" y1="375" x2="618" y2="375" stroke="#e2001a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="596" y="395" text-anchor="middle" font-size="9" font-weight="bold" fill="#e2001a">✗ Blockiert</text>

  <!-- Legend -->
  <rect x="30" y="535" width="840" height="3" rx="1" fill="#ddd"/>
  <line x1="50" y1="548" x2="80" y2="548" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="88" y="552" font-size="10" fill="#555">Erlaubt</text>
  <line x1="170" y1="548" x2="200" y2="548" stroke="#e2001a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="208" y="552" font-size="10" fill="#555">Blockiert</text>
  <text x="340" y="552" font-size="10" fill="#777">Prinzip: IoT-Geräte können weder auf das Privat-Netz noch auf das Gast-Netz zugreifen.</text>
</svg>