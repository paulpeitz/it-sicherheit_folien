<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 450">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
  </defs>

  <!-- ══ Box 1: ROM / Root of Trust ══ -->
  <rect x="30" y="8" width="280" height="65" rx="10" fill="#e2001a"/>
  <text x="170" y="38" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold">ROM / Root of Trust</text>
  <text x="170" y="59" text-anchor="middle" fill="rgba(255,255,255,0.82)" font-family="Segoe UI, Arial, sans-serif" font-size="11">unveränderlich · Vertrauensanker</text>

  <!-- PCR 0–1 -->
  <line x1="310" y1="40" x2="326" y2="40" stroke="#e2001a" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="326" y="28" width="84" height="24" rx="12" fill="none" stroke="#e2001a" stroke-width="1.2"/>
  <text x="368" y="44" text-anchor="middle" fill="#e2001a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">PCR 0 – 1</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="73" x2="170" y2="122" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="83" y="86" width="175" height="21" rx="10" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="170" y="101" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="11">misst &amp; verifiziert</text>

  <!-- ══ Box 2: Bootloader ══ -->
  <rect x="30" y="127" width="280" height="65" rx="10" fill="#1c3f6e"/>
  <text x="170" y="157" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold">Bootloader</text>
  <text x="170" y="178" text-anchor="middle" fill="rgba(255,255,255,0.72)" font-family="Segoe UI, Arial, sans-serif" font-size="11">UEFI / GRUB / iBoot</text>

  <!-- PCR 4–5 -->
  <line x1="310" y1="160" x2="326" y2="160" stroke="#1c3f6e" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="326" y="148" width="84" height="24" rx="12" fill="none" stroke="#1c3f6e" stroke-width="1.2"/>
  <text x="368" y="164" text-anchor="middle" fill="#1c3f6e" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">PCR 4 – 5</text>

  <!-- Arrow 2 -->
  <line x1="170" y1="192" x2="170" y2="241" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="83" y="205" width="175" height="21" rx="10" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="170" y="220" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="11">misst &amp; verifiziert</text>

  <!-- ══ Box 3: Kernel ══ -->
  <rect x="30" y="246" width="280" height="65" rx="10" fill="#2d3748"/>
  <text x="170" y="276" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold">Kernel</text>
  <text x="170" y="297" text-anchor="middle" fill="rgba(255,255,255,0.72)" font-family="Segoe UI, Arial, sans-serif" font-size="11">OS-Kern · Treiber</text>

  <!-- PCR 8–15 -->
  <line x1="310" y1="279" x2="326" y2="279" stroke="#2d3748" stroke-width="1.2" stroke-dasharray="4,2"/>
  <rect x="326" y="267" width="84" height="24" rx="12" fill="none" stroke="#2d3748" stroke-width="1.2"/>
  <text x="368" y="283" text-anchor="middle" fill="#2d3748" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">PCR 8 – 15</text>

  <!-- Arrow 3 -->
  <line x1="170" y1="311" x2="170" y2="360" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="83" y="324" width="175" height="21" rx="10" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="170" y="339" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="11">misst &amp; verifiziert</text>

  <!-- ══ Box 4: OS / Apps ══ -->
  <rect x="30" y="365" width="280" height="65" rx="10" fill="#276749"/>
  <text x="170" y="395" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold">OS / Apps</text>
  <text x="170" y="416" text-anchor="middle" fill="rgba(255,255,255,0.72)" font-family="Segoe UI, Arial, sans-serif" font-size="11">Anwendungsebene</text>
</svg>
