<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 340">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
  </defs>

  <!-- Pipeline arrow background -->
  <rect x="20" y="80" width="710" height="100" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>

  <!-- Stage 1: Pre-Commit -->
  <rect x="30" y="56" width="120" height="24" rx="12" fill="#276749"/>
  <text x="90" y="72" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Pre-Commit</text>

  <rect x="35" y="92" width="110" height="76" rx="8" fill="white" stroke="#276749" stroke-width="1.5"/>
  <text x="90" y="112" text-anchor="middle" fill="#276749" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">🔍 Linting</text>
  <text x="90" y="128" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="9">Secrets Scanning</text>
  <text x="90" y="144" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="9">(GitLeaks)</text>
  <text x="90" y="160" text-anchor="middle" fill="#888" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-style="italic">lokal, sofort</text>

  <!-- Arrow -->
  <line x1="148" y1="130" x2="170" y2="130" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 2: Build -->
  <rect x="175" y="56" width="120" height="24" rx="12" fill="#1c3f6e"/>
  <text x="235" y="72" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Build</text>

  <rect x="180" y="92" width="110" height="76" rx="8" fill="white" stroke="#1c3f6e" stroke-width="1.5"/>
  <text x="235" y="112" text-anchor="middle" fill="#1c3f6e" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">🛡 SAST</text>
  <text x="235" y="128" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="9">SCA / SBOM</text>
  <text x="235" y="144" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="9">Container Scan</text>
  <text x="235" y="160" text-anchor="middle" fill="#e2001a" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="bold">🚫 Build Break</text>

  <!-- Arrow -->
  <line x1="293" y1="130" x2="315" y2="130" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 3: Test -->
  <rect x="320" y="56" width="120" height="24" rx="12" fill="#e8a520"/>
  <text x="380" y="72" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Test</text>

  <rect x="325" y="92" width="110" height="76" rx="8" fill="white" stroke="#e8a520" stroke-width="1.5"/>
  <text x="380" y="112" text-anchor="middle" fill="#e8a520" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">⚡ DAST</text>
  <text x="380" y="128" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="9">IAST (Staging)</text>
  <text x="380" y="144" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="9">Pen-Test (manuell)</text>
  <text x="380" y="160" text-anchor="middle" fill="#888" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-style="italic">laufende App</text>

  <!-- Arrow -->
  <line x1="438" y1="130" x2="460" y2="130" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 4: Deploy -->
  <rect x="465" y="56" width="120" height="24" rx="12" fill="#c53030"/>
  <text x="525" y="72" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Deploy</text>

  <rect x="470" y="92" width="110" height="76" rx="8" fill="white" stroke="#c53030" stroke-width="1.5"/>
  <text x="525" y="112" text-anchor="middle" fill="#c53030" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">🔒 Hardening</text>
  <text x="525" y="128" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="9">Config-Audit</text>
  <text x="525" y="144" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="9">Infra-as-Code</text>
  <text x="525" y="160" text-anchor="middle" fill="#888" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-style="italic">automatisiert</text>

  <!-- Arrow -->
  <line x1="583" y1="130" x2="605" y2="130" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 5: Runtime -->
  <rect x="610" y="56" width="120" height="24" rx="12" fill="#e2001a"/>
  <text x="670" y="72" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Runtime</text>

  <rect x="615" y="92" width="110" height="76" rx="8" fill="white" stroke="#e2001a" stroke-width="1.5"/>
  <text x="670" y="112" text-anchor="middle" fill="#e2001a" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">📡 Monitoring</text>
  <text x="670" y="128" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="9">RASP / WAF</text>
  <text x="670" y="144" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="9">SIEM / Alerting</text>
  <text x="670" y="160" text-anchor="middle" fill="#888" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-style="italic">kontinuierlich</text>

  <!-- Feedback loop arrow -->
  <path d="M 670 180 C 670 240, 670 250, 630 260 L 130 260 C 90 260, 90 240, 90 220 L 90 180" fill="none" stroke="#1c3f6e" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <rect x="310" y="248" width="140" height="22" rx="11" fill="#1c3f6e"/>
  <text x="380" y="263" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">🔄 Feedback-Loop</text>

  <!-- Bottom: Key insight -->
  <rect x="130" y="295" width="490" height="34" rx="12" fill="#2d3748"/>
  <text x="375" y="317" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Security in jeder Phase — nicht nur am Ende (Shift Left)</text>
</svg>