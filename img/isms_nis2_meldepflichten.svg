<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="timeArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e2001a"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Timeline base line -->
  <line x1="60" y1="155" x2="770" y2="155" stroke="#e2001a" stroke-width="3" marker-end="url(#timeArrow)"/>

  <!-- Timeline dots -->
  <circle cx="100" cy="155" r="10" fill="#e2001a"/>
  <circle cx="320" cy="155" r="10" fill="#c4161c"/>
  <circle cx="560" cy="155" r="10" fill="#888"/>

  <!-- Time labels (above line) -->
  <text x="100" y="125" text-anchor="middle" font-size="26" font-weight="bold" fill="#e2001a">24 h</text>
  <text x="320" y="125" text-anchor="middle" font-size="26" font-weight="bold" fill="#c4161c">72 h</text>
  <text x="560" y="125" text-anchor="middle" font-size="26" font-weight="bold" fill="#888">1 Monat</text>

  <!-- Small labels above times -->
  <text x="100" y="98" text-anchor="middle" font-size="12" fill="#888">Phase 1</text>
  <text x="320" y="98" text-anchor="middle" font-size="12" fill="#888">Phase 2</text>
  <text x="560" y="98" text-anchor="middle" font-size="12" fill="#888">Phase 3</text>

  <!-- Description boxes (below line) -->
  <!-- Box 1 -->
  <rect x="20" y="185" width="180" height="120" rx="10" fill="white" stroke="#e2001a" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#e2001a">Frühwarnung</text>
  <line x1="40" y1="220" x2="180" y2="220" stroke="#f0f0f0" stroke-width="1"/>
  <text x="110" y="242" text-anchor="middle" font-size="11" fill="#555">Erste Meldung an</text>
  <text x="110" y="258" text-anchor="middle" font-size="11" fill="#555">nationale Behörde</text>
  <text x="110" y="280" text-anchor="middle" font-size="11" fill="#555">(z. B. BSI)</text>

  <!-- Box 2 -->
  <rect x="230" y="185" width="180" height="120" rx="10" fill="white" stroke="#c4161c" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#c4161c">Incident Report</text>
  <line x1="250" y1="220" x2="390" y2="220" stroke="#f0f0f0" stroke-width="1"/>
  <text x="320" y="242" text-anchor="middle" font-size="11" fill="#555">Detaillierte Meldung</text>
  <text x="320" y="258" text-anchor="middle" font-size="11" fill="#555">mit ersten Analysen</text>
  <text x="320" y="280" text-anchor="middle" font-size="11" fill="#555">und Einschätzung</text>

  <!-- Box 3 -->
  <rect x="460" y="185" width="200" height="120" rx="10" fill="white" stroke="#888" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">Abschlussbericht</text>
  <line x1="480" y1="220" x2="640" y2="220" stroke="#f0f0f0" stroke-width="1"/>
  <text x="560" y="242" text-anchor="middle" font-size="11" fill="#555">Ursachenanalyse,</text>
  <text x="560" y="258" text-anchor="middle" font-size="11" fill="#555">ergriffene Maßnahmen,</text>
  <text x="560" y="280" text-anchor="middle" font-size="11" fill="#555">grenzüberschr. Auswirkung</text>

  <!-- Start label -->
  <text x="60" y="155" text-anchor="middle" font-size="10" fill="#888" dy="-20">Vorfall</text>
  <text x="60" y="155" text-anchor="middle" font-size="10" fill="#888" dy="-8">erkannt</text>

  <!-- End label -->
  <text x="785" y="148" text-anchor="start" font-size="10" fill="#888">Zeit</text>
</svg>