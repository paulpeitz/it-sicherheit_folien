<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="400" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-up" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 7, 5 0, 10 7" fill="#e2001a"/>
    </marker>
  </defs>

  <!-- Urgency arrow on the left -->
  <line x1="55" y1="355" x2="55" y2="35" stroke="#e2001a" stroke-width="3" marker-end="url(#arrow-up)"/>
  <text x="40" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2001a" transform="rotate(-90,40,195)">Dringlichkeit</text>

  <!-- Layer 1 (top - most volatile): CPU-Register, Cache -->
  <g filter="url(#shadow)">
    <rect x="100" y="20" width="560" height="48" rx="8" fill="#e2001a"/>
    <text x="380" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">CPU-Register &amp; Cache</text>
    <text x="380" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">Verlust: Nanosekunden – nur bei Live-Forensik erfassbar</text>
  </g>

  <!-- Layer 2: RAM -->
  <g filter="url(#shadow)">
    <rect x="120" y="80" width="520" height="48" rx="8" fill="#bf360c"/>
    <text x="380" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Arbeitsspeicher (RAM)</text>
    <text x="380" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">Prozesse, Netzwerkverbindungen, Verschlüsselungskeys</text>
  </g>

  <!-- Layer 3: Netzwerkverbindungen -->
  <g filter="url(#shadow)">
    <rect x="140" y="140" width="480" height="48" rx="8" fill="#e65100"/>
    <text x="380" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Netzwerkverbindungen &amp; ARP-Tabellen</text>
    <text x="380" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">Aktive Sessions, Routing, offene Ports</text>
  </g>

  <!-- Layer 4: Temp-Dateien, laufende Prozesse -->
  <g filter="url(#shadow)">
    <rect x="160" y="200" width="440" height="48" rx="8" fill="#1c3f6e"/>
    <text x="380" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Temporäre Dateien &amp; Swap</text>
    <text x="380" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">Können beim Neustart überschrieben werden</text>
  </g>

  <!-- Layer 5: Festplatte / SSD -->
  <g filter="url(#shadow)">
    <rect x="180" y="260" width="400" height="48" rx="8" fill="#1c3f6e" fill-opacity="0.8"/>
    <text x="380" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Festplatte / SSD</text>
    <text x="380" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">Dateisystem, Logs, Registry, gelöschte Dateien</text>
  </g>

  <!-- Layer 6 (bottom - least volatile): Backups -->
  <g filter="url(#shadow)">
    <rect x="200" y="320" width="360" height="48" rx="8" fill="#2e7d32"/>
    <text x="380" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Backups &amp; externe Logs</text>
    <text x="380" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">SIEM-Daten, Archiv, Cloud-Logs – persistent</text>
  </g>

  <!-- Labels on right side -->
  <text x="680" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e2001a" font-weight="bold">Flüchtig</text>
  <text x="680" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32" font-weight="bold">Persistent</text>
</svg>