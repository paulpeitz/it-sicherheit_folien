<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2001a"/>
      <stop offset="100%" stop-color="#b30015"/>
    </linearGradient>
    <marker id="arrBlack" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e2001a"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" rx="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="900" height="52" rx="12" fill="url(#headerGrad2)"/>
  <rect y="40" width="900" height="12" fill="url(#headerGrad2)"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">ARP Spoofing – Normal vs. Angriff</text>

  <!-- LEFT SIDE: Normal ARP -->
  <rect x="30" y="65" width="410" height="30" rx="6" fill="#27ae60"/>
  <text x="235" y="85" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">Normaler ARP-Ablauf</text>

  <!-- Client -->
  <rect x="60" y="110" width="100" height="70" rx="8" fill="#fff" stroke="#2c3e50" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="85" y="120" width="50" height="30" rx="3" fill="#d5dbdb"/>
  <rect x="95" y="155" width="30" height="15" rx="2" fill="#d5dbdb"/>
  <text x="110" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#2c3e50">Client</text>
  <text x="110" y="210" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#7f8c8d">192.168.1.10</text>

  <!-- Gateway -->
  <rect x="310" y="110" width="100" height="70" rx="8" fill="#fff" stroke="#2c3e50" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="330" y="118" width="60" height="25" rx="3" fill="#3498db"/>
  <circle cx="340" cy="158" r="5" fill="#27ae60"/>
  <circle cx="355" cy="158" r="5" fill="#27ae60"/>
  <circle cx="370" cy="158" r="5" fill="#f39c12"/>
  <circle cx="385" cy="158" r="5" fill="#27ae60"/>
  <text x="360" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#2c3e50">Gateway</text>
  <text x="360" y="210" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#7f8c8d">192.168.1.1</text>

  <!-- Normal arrows -->
  <line x1="165" y1="130" x2="305" y2="130" stroke="#27ae60" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="235" y="125" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#27ae60">ARP Request (Broadcast)</text>
  <text x="235" y="137" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#555">Wer hat 192.168.1.1?</text>

  <line x1="305" y1="160" x2="165" y2="160" stroke="#27ae60" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="235" y="155" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#27ae60">ARP Reply (Unicast)</text>
  <text x="235" y="167" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#555">MAC: AA:BB:CC:DD:EE:FF</text>

  <!-- ARP Cache normal -->
  <rect x="60" y="230" width="180" height="50" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
  <text x="150" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#1e8449">ARP-Cache (korrekt)</text>
  <text x="150" y="268" text-anchor="middle" font-family="Segoe UI,monospace" font-size="10" fill="#2c3e50">192.168.1.1 → AA:BB:CC:DD:EE:FF</text>

  <!-- Checkmark -->
  <circle cx="400" cy="255" r="16" fill="#27ae60"/>
  <text x="400" y="261" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#fff">✓</text>

  <!-- RIGHT SIDE: ARP Spoofing -->
  <rect x="460" y="65" width="410" height="30" rx="6" fill="#e2001a"/>
  <text x="665" y="85" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">ARP Spoofing (Angriff)</text>

  <!-- Client right -->
  <rect x="480" y="110" width="100" height="70" rx="8" fill="#fff" stroke="#2c3e50" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="505" y="120" width="50" height="30" rx="3" fill="#d5dbdb"/>
  <rect x="515" y="155" width="30" height="15" rx="2" fill="#d5dbdb"/>
  <text x="530" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#2c3e50">Client</text>
  <text x="530" y="210" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#7f8c8d">192.168.1.10</text>

  <!-- Attacker -->
  <rect x="660" y="270" width="100" height="70" rx="8" fill="#fdf2f2" stroke="#e2001a" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="685" y="280" width="50" height="30" rx="3" fill="#e2001a" opacity="0.3"/>
  <rect x="695" y="315" width="30" height="15" rx="2" fill="#e2001a" opacity="0.3"/>
  <text x="710" y="355" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#e2001a">Angreifer</text>
  <text x="710" y="370" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e2001a">192.168.1.50</text>

  <!-- Gateway right -->
  <rect x="770" y="110" width="100" height="70" rx="8" fill="#fff" stroke="#2c3e50" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="790" y="118" width="60" height="25" rx="3" fill="#3498db"/>
  <circle cx="800" cy="158" r="5" fill="#27ae60"/>
  <circle cx="815" cy="158" r="5" fill="#27ae60"/>
  <circle cx="830" cy="158" r="5" fill="#f39c12"/>
  <circle cx="845" cy="158" r="5" fill="#27ae60"/>
  <text x="820" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#2c3e50">Gateway</text>
  <text x="820" y="210" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#7f8c8d">192.168.1.1</text>

  <!-- Spoofed ARP reply to client -->
  <line x1="660" y1="290" x2="580" y2="180" stroke="#e2001a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrRed)"/>
  <text x="590" y="255" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#e2001a">Gefälschter ARP Reply</text>
  <text x="590" y="268" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#e2001a">192.168.1.1 → EVIL-MAC</text>

  <!-- Spoofed ARP reply to gateway -->
  <line x1="760" y1="290" x2="820" y2="180" stroke="#e2001a" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrRed)"/>
  <text x="810" y="268" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#e2001a">Gefälschter ARP Reply</text>
  <text x="810" y="281" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#e2001a">192.168.1.10 → EVIL-MAC</text>

  <!-- Poisoned ARP Cache -->
  <rect x="480" y="230" width="180" height="50" rx="6" fill="#fdf2f2" stroke="#e2001a" stroke-width="1.5"/>
  <text x="570" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#c0392b">ARP-Cache (vergiftet)</text>
  <text x="570" y="268" text-anchor="middle" font-family="Segoe UI,monospace" font-size="10" fill="#e2001a">192.168.1.1 → EVIL-MAC</text>

  <!-- Warning -->
  <circle cx="480" cy="255" r="16" fill="#e2001a"/>
  <text x="480" y="261" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#fff">✗</text>

  <!-- MITM flow arrows -->
  <rect x="570" y="395" width="280" height="40" rx="6" fill="#34495e"/>
  <text x="575" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#fff">Ergebnis: Traffic fließt über den Angreifer</text>
  <text x="575" y="427" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e74c3c">→ Man-in-the-Middle (MITM)</text>

  <!-- Bottom info -->
  <rect x="30" y="450" width="840" height="35" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1"/>
  <text x="450" y="473" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#2c3e50">Schutz: Dynamic ARP Inspection (DAI) · DHCP Snooping · VLAN-Segmentierung · Port Security</text>
</svg>