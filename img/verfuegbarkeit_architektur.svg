<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Hochverfügbarkeits-Architektur</text>

  <!-- Region 1 -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="360" height="410" rx="10" fill="#e8eaf6" stroke="#5c6bc0" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="180" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#3949ab">Region A (Primär)</text>

    <!-- Load Balancer -->
    <rect x="110" y="45" width="140" height="44" rx="8" fill="#1565c0" filter="url(#shadow)"/>
    <text x="180" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Load Balancer</text>

    <!-- Arrows from LB -->
    <line x1="150" y1="89" x2="85" y2="130" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="210" y1="89" x2="275" y2="130" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Server 1 Active -->
    <rect x="30" y="130" width="120" height="55" rx="8" fill="#2e7d32" filter="url(#shadow)"/>
    <text x="90" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Server 1</text>
    <text x="90" y="170" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Active</text>

    <!-- Server 2 Active -->
    <rect x="210" y="130" width="120" height="55" rx="8" fill="#2e7d32" filter="url(#shadow)"/>
    <text x="270" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Server 2</text>
    <text x="270" y="170" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Active</text>

    <!-- Arrows to DB -->
    <line x1="90" y1="185" x2="140" y2="225" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="270" y1="185" x2="220" y2="225" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Database Primary -->
    <g transform="translate(120, 225)">
      <ellipse cx="60" cy="10" rx="60" ry="12" fill="#e65100"/>
      <rect x="0" y="10" width="120" height="36" fill="#e65100"/>
      <ellipse cx="60" cy="46" rx="60" ry="12" fill="#bf360c"/>
      <text x="60" y="35" text-anchor="middle" font-size="11" font-weight="bold" fill="white">DB Primary</text>
    </g>

    <!-- Backup -->
    <rect x="110" y="310" width="140" height="44" rx="8" fill="#f57f17" filter="url(#shadow)"/>
    <text x="180" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Backup Storage</text>
    <text x="180" y="344" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">3-2-1 Regel</text>

    <!-- Arrow DB to Backup -->
    <line x1="180" y1="285" x2="180" y2="308" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="195" y="300" font-size="8" fill="#888">Snapshot</text>

    <!-- SLA indicator -->
    <rect x="30" y="370" width="300" height="30" rx="6" fill="white" stroke="#5c6bc0" stroke-width="1"/>
    <text x="180" y="390" text-anchor="middle" font-size="10" fill="#333">Active/Active · Auto-Failover · SLA 99,99%</text>
  </g>

  <!-- Replication arrow between regions -->
  <g transform="translate(380, 220)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="40" y1="12" x2="0" y2="12" stroke="#c62828" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="20" y="-10" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">Synchrone</text>
    <text x="20" y="28" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">Replikation</text>
  </g>

  <!-- Region 2 -->
  <g transform="translate(420, 55)">
    <rect x="0" y="0" width="360" height="410" rx="10" fill="#fce4ec" stroke="#e53935" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="180" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">Region B (Standby)</text>

    <!-- Load Balancer Standby -->
    <rect x="110" y="45" width="140" height="44" rx="8" fill="#78909c" filter="url(#shadow)"/>
    <text x="180" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Load Balancer</text>

    <!-- Arrows from LB -->
    <line x1="150" y1="89" x2="85" y2="130" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
    <line x1="210" y1="89" x2="275" y2="130" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

    <!-- Server 3 Standby -->
    <rect x="30" y="130" width="120" height="55" rx="8" fill="#78909c" filter="url(#shadow)"/>
    <text x="90" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Server 3</text>
    <text x="90" y="170" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Warm Standby</text>

    <!-- Server 4 Standby -->
    <rect x="210" y="130" width="120" height="55" rx="8" fill="#78909c" filter="url(#shadow)"/>
    <text x="270" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Server 4</text>
    <text x="270" y="170" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Warm Standby</text>

    <!-- Arrows to DB -->
    <line x1="90" y1="185" x2="140" y2="225" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
    <line x1="270" y1="185" x2="220" y2="225" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

    <!-- Database Replica -->
    <g transform="translate(120, 225)">
      <ellipse cx="60" cy="10" rx="60" ry="12" fill="#78909c"/>
      <rect x="0" y="10" width="120" height="36" fill="#78909c"/>
      <ellipse cx="60" cy="46" rx="60" ry="12" fill="#546e7a"/>
      <text x="60" y="35" text-anchor="middle" font-size="11" font-weight="bold" fill="white">DB Replica</text>
    </g>

    <!-- Offsite Backup -->
    <rect x="110" y="310" width="140" height="44" rx="8" fill="#78909c" filter="url(#shadow)"/>
    <text x="180" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Offsite Backup</text>
    <text x="180" y="344" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Air-Gapped / Tape</text>

    <line x1="180" y1="285" x2="180" y2="308" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

    <!-- SLA indicator -->
    <rect x="30" y="370" width="300" height="30" rx="6" fill="white" stroke="#e53935" stroke-width="1"/>
    <text x="180" y="390" text-anchor="middle" font-size="10" fill="#333">Warm Standby · RTO &lt; 15 min · RPO &lt; 1 min</text>
  </g>

  <!-- Bottom: Users + DNS -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="200" height="32" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1" filter="url(#shadow)"/>
    <text x="100" y="21" text-anchor="middle" font-size="11" fill="#333">Benutzer → Global DNS (GeoDNS / Anycast)</text>
  </g>
</svg>