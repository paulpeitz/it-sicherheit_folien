<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <polygon points="0,1 10,5 0,9" fill="#555"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <polygon points="0,1 10,5 0,9" fill="#c62828"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
  </style>

  <!-- Title -->
  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">CTR-Modus (Counter Mode) – Parallelisierbare Stromchiffre</text>

  <!-- Nonce -->
  <rect x="30" y="55" width="100" height="40" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">Nonce</text>
  <text x="80" y="87" text-anchor="middle" font-size="9" fill="#888">einmalig pro Nachricht</text>

  <!-- Block 1 -->
  <!-- Counter 0 -->
  <rect x="30" y="115" width="100" height="35" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">Nonce || CTR 0</text>

  <!-- AES Block 1 -->
  <rect x="160" y="110" width="100" height="45" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">AES</text>
  <text x="210" y="147" text-anchor="middle" font-size="10" fill="#555">Encrypt</text>

  <line x1="130" y1="132" x2="157" y2="132" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Schlüssel K -->
  <rect x="160" y="55" width="100" height="35" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">🔑 Schlüssel K</text>

  <line x1="210" y1="90" x2="210" y2="107" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- XOR 1 -->
  <circle cx="310" cy="132" r="16" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="310" y="137" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">⊕</text>

  <line x1="260" y1="132" x2="291" y2="132" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Klartext P1 -->
  <rect x="280" y="60" width="60" height="30" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="310" y="80" text-anchor="middle" font-size="10" fill="#555">P₁</text>
  <line x1="310" y1="90" x2="310" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ciphertext C1 -->
  <rect x="280" y="170" width="60" height="30" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="310" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">C₁</text>
  <line x1="310" y1="148" x2="310" y2="167" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Block 2 -->
  <rect x="370" y="115" width="100" height="35" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="420" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">Nonce || CTR 1</text>

  <rect x="500" y="110" width="100" height="45" rx="8" fill="#bbdefb" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="550" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">AES</text>
  <text x="550" y="147" text-anchor="middle" font-size="10" fill="#555">Encrypt</text>

  <line x1="470" y1="132" x2="497" y2="132" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Schlüssel K Pfeil 2 -->
  <line x1="260" y1="72" x2="550" y2="72" stroke="#f9a825" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="550" y1="72" x2="550" y2="107" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- XOR 2 -->
  <circle cx="650" cy="132" r="16" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="650" y="137" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">⊕</text>
  <line x1="600" y1="132" x2="631" y2="132" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="620" y="60" width="60" height="30" rx="6" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="650" y="80" text-anchor="middle" font-size="10" fill="#555">P₂</text>
  <line x1="650" y1="90" x2="650" y2="113" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="620" y="170" width="60" height="30" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#c62828">C₂</text>
  <line x1="650" y1="148" x2="650" y2="167" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Block 3 (Dots) -->
  <text x="740" y="140" text-anchor="middle" font-size="24" fill="#888">…</text>

  <!-- Block N -->
  <rect x="770" y="115" width="80" height="35" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="137" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Nonce || CTR n</text>

  <!-- Vorteile Box -->
  <rect x="30" y="230" width="820" height="130" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Vorteile des CTR-Modus</text>

  <text x="60" y="285" font-size="12" fill="#555">✅ <tspan font-weight="bold">Parallelisierbar:</tspan> Alle Blöcke können gleichzeitig verschlüsselt werden</text>
  <text x="60" y="305" font-size="12" fill="#555">✅ <tspan font-weight="bold">Kein Padding:</tspan> Letzter Block kann beliebig kurz sein</text>
  <text x="60" y="325" font-size="12" fill="#555">✅ <tspan font-weight="bold">Zufallszugriff:</tspan> Jeder Block einzeln entschlüsselbar (z.B. Festplattenverschlüsselung)</text>
  <text x="60" y="345" font-size="12" fill="#555">⚠️ <tspan font-weight="bold">Nonce nie wiederverwenden!</tspan> Sonst: XOR zweier Klartexte rekonstruierbar</text>
</svg>