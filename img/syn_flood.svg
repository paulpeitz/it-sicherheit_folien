<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2001a"/>
      <stop offset="100%" stop-color="#b3001a"/>
    </linearGradient>
    <marker id="aBlk" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
    <marker id="aGrn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#27ae60"/>
    </marker>
    <marker id="aRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e2001a"/>
    </marker>
  </defs>

  <rect width="900" height="480" rx="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="900" height="52" rx="12" fill="url(#headerGrad3)"/>
  <rect y="40" width="900" height="12" fill="url(#headerGrad3)"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">TCP 3-Way-Handshake: Normal vs. SYN Flood</text>

  <!-- LEFT: Normal handshake -->
  <rect x="30" y="65" width="405" height="30" rx="6" fill="#27ae60"/>
  <text x="232" y="85" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">Normaler Verbindungsaufbau</text>

  <!-- Client timeline -->
  <rect x="70" y="108" width="80" height="30" rx="5" fill="#3498db" filter="url(#shadow3)"/>
  <text x="110" y="128" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">Client</text>
  <line x1="110" y1="140" x2="110" y2="380" stroke="#3498db" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Server timeline -->
  <rect x="310" y="108" width="80" height="30" rx="5" fill="#2c3e50" filter="url(#shadow3)"/>
  <text x="350" y="128" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">Server</text>
  <line x1="350" y1="140" x2="350" y2="380" stroke="#2c3e50" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- SYN -->
  <line x1="115" y1="170" x2="345" y2="195" stroke="#27ae60" stroke-width="2" marker-end="url(#aGrn)"/>
  <text x="230" y="168" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#27ae60">SYN</text>

  <!-- SYN/ACK -->
  <line x1="345" y1="225" x2="115" y2="250" stroke="#27ae60" stroke-width="2" marker-end="url(#aGrn)"/>
  <text x="230" y="223" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#27ae60">SYN/ACK</text>

  <!-- ACK -->
  <line x1="115" y1="280" x2="345" y2="305" stroke="#27ae60" stroke-width="2" marker-end="url(#aGrn)"/>
  <text x="230" y="278" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#27ae60">ACK</text>

  <!-- Connection established -->
  <rect x="100" y="330" width="270" height="30" rx="5" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
  <text x="235" y="350" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#27ae60">Verbindung hergestellt ✓</text>

  <!-- Backlog label -->
  <rect x="370" y="175" width="50" height="65" rx="4" fill="#e8f8f0" stroke="#27ae60" stroke-width="1"/>
  <text x="395" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#27ae60">Backlog</text>
  <rect x="378" y="205" width="34" height="8" rx="2" fill="#27ae60" opacity="0.5"/>
  <rect x="378" y="218" width="34" height="8" rx="2" fill="#eee"/>
  <rect x="378" y="225" width="34" height="8" rx="2" fill="#eee"/>

  <!-- RIGHT: SYN Flood -->
  <rect x="465" y="65" width="405" height="30" rx="6" fill="#e2001a"/>
  <text x="667" y="85" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">SYN Flood (Angriff)</text>

  <!-- Attacker timeline -->
  <rect x="505" y="108" width="80" height="30" rx="5" fill="#e2001a" filter="url(#shadow3)"/>
  <text x="545" y="128" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">Angreifer</text>
  <line x1="545" y1="140" x2="545" y2="380" stroke="#e2001a" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Server timeline right -->
  <rect x="745" y="108" width="80" height="30" rx="5" fill="#2c3e50" filter="url(#shadow3)"/>
  <text x="785" y="128" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#fff">Server</text>
  <line x1="785" y1="140" x2="785" y2="380" stroke="#2c3e50" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Multiple SYN attacks -->
  <line x1="550" y1="160" x2="780" y2="172" stroke="#e2001a" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="660" y="155" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#e2001a">SYN (IP: gefälscht)</text>

  <line x1="550" y1="190" x2="780" y2="202" stroke="#e2001a" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="660" y="188" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e2001a">SYN (IP: gefälscht)</text>

  <line x1="550" y1="220" x2="780" y2="232" stroke="#e2001a" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="660" y="218" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e2001a">SYN (IP: gefälscht)</text>

  <line x1="550" y1="250" x2="780" y2="262" stroke="#e2001a" stroke-width="2" marker-end="url(#aRed)"/>
  <text x="660" y="248" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e2001a">SYN (IP: gefälscht)</text>

  <!-- SYN/ACK going to void -->
  <line x1="780" y1="185" x2="650" y2="180" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="730" y="178" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#999">SYN/ACK → ins Leere</text>

  <!-- Backlog full -->
  <rect x="805" y="160" width="60" height="120" rx="4" fill="#fdf2f2" stroke="#e2001a" stroke-width="1.5"/>
  <text x="835" y="178" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="600" fill="#e2001a">Backlog</text>
  <rect x="813" y="186" width="44" height="8" rx="2" fill="#e2001a" opacity="0.7"/>
  <rect x="813" y="198" width="44" height="8" rx="2" fill="#e2001a" opacity="0.7"/>
  <rect x="813" y="210" width="44" height="8" rx="2" fill="#e2001a" opacity="0.7"/>
  <rect x="813" y="222" width="44" height="8" rx="2" fill="#e2001a" opacity="0.7"/>
  <rect x="813" y="234" width="44" height="8" rx="2" fill="#e2001a" opacity="0.7"/>
  <rect x="813" y="246" width="44" height="8" rx="2" fill="#e2001a" opacity="0.7"/>
  <rect x="813" y="258" width="44" height="8" rx="2" fill="#e2001a" opacity="0.5"/>
  <text x="835" y="275" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" fill="#e2001a">VOLL!</text>

  <!-- Denied connection -->
  <rect x="535" y="330" width="270" height="30" rx="5" fill="#fdf2f2" stroke="#e2001a" stroke-width="1.5"/>
  <text x="670" y="350" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#e2001a">Neue Verbindungen abgelehnt ✗</text>

  <!-- Bottom bar -->
  <rect x="30" y="430" width="840" height="35" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1"/>
  <text x="450" y="452" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#2c3e50">Schutz: SYN Cookies · Backlog vergrößern · Rate Limiting · DDoS-Mitigation (Cloudflare, AWS Shield)</text>
</svg>