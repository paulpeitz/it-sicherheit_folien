  <text x="480" y="106" text-anchor="middle" font-size="10" fill="#E65100" font-style="italic">Edge / Fog Layer</text>

  <!-- Gateway -->
  <rect x="365" y="120" width="230" height="60" rx="8" fill="#fff" stroke="#FFA726" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="378" y="138" width="20" height="14" rx="3" fill="none" stroke="#FB8C00" stroke-width="1.5"/>
  <line x1="382" y1="144" x2="382" y2="148" stroke="#FB8C00" stroke-width="1.2"/>
  <line x1="386" y1="142" x2="386" y2="148" stroke="#FB8C00" stroke-width="1.2"/>
  <line x1="390" y1="140" x2="390" y2="148" stroke="#FB8C00" stroke-width="1.2"/>
  <line x1="394" y1="144" x2="394" y2="148" stroke="#FB8C00" stroke-width="1.2"/>
  <text x="490" y="146" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333">IoT-Gateway</text>
  <text x="490" y="164" text-anchor="middle" font-size="9" fill="#777">Protokollübersetzung: Zigbee → MQTT / IP</text>

  <!-- Edge Computing -->
  <rect x="365" y="192" width="230" height="60" rx="8" fill="#fff" stroke="#FFA726" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="378" y="210" width="18" height="14" rx="2" fill="none" stroke="#FB8C00" stroke-width="1.5"/>
  <path d="M380,216 L384,212 L388,218 L392,214 L396,220" fill="none" stroke="#FB8C00" stroke-width="1.2"/>
  <text x="490" y="218" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333">Edge Computing</text>
  <text x="490" y="236" text-anchor="middle" font-size="9" fill="#777">Lokale Vorverarbeitung, Latenzreduzierung</text>

  <!-- Local Firewall -->
  <rect x="365" y="264" width="230" height="52" rx="8" fill="#fff" stroke="#FFA726" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="380" y="278" width="14" height="12" rx="1" fill="none" stroke="#FB8C00" stroke-width="1.5"/>
  <line x1="376" y1="284" x2="398" y2="284" stroke="#FB8C00" stroke-width="1.5"/>
  <text x="490" y="286" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333">Lokale Firewall</text>
  <text x="490" y="304" text-anchor="middle" font-size="9" fill="#777">Segmentierung, Paketfilterung</text>

  <!-- Protocol box -->
  <rect x="365" y="332" width="230" height="42" rx="8" fill="#FFF3E0" stroke="#FB8C00" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="480" y="349" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#E65100">Protokolle</text>
  <text x="480" y="365" text-anchor="middle" font-size="9.5" fill="#546E7A">MQTT · CoAP · HTTP · AMQP</text>

  <!-- Tasks -->
  <rect x="365" y="386" width="230" height="48" rx="8" fill="#fff" stroke="#FFCC80" stroke-width="1"/>
  <text x="480" y="403" text-anchor="middle" font-size="9" font-weight="600" fill="#555">Aufgaben</text>
  <text x="480" y="418" text-anchor="middle" font-size="9" fill="#777">Aggregation, Filterung, lokale Entscheidungen</text>
  <text x="480" y="429" text-anchor="middle" font-size="9" fill="#777">Erste Sicherheitsmaßnahmen</text>

  <!-- Threat label -->
  <rect x="365" y="444" width="230" height="24" rx="5" fill="#FFEBEE" stroke="#e2001a" stroke-width="0.8"/>
  <text x="480" y="460" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">Bedrohung: Man-in-the-Middle, Replay</text>

  <!-- ============================================ -->
  <!-- ARROW 2 → 3  (bidirectional) -->
  <!-- ============================================ -->
  <line x1="621" y1="230" x2="665" y2="230" stroke="#546E7A" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="665" y1="244" x2="621" y2="244" stroke="#546E7A" stroke-width="2" marker-end="url(#arrowL)"/>
  <rect x="621" y="252" width="48" height="32" rx="4" fill="#fff" stroke="#90A4AE" stroke-width="0.8"/>
  <text x="645" y="265" text-anchor="middle" font-size="7.5" fill="#546E7A">MQTT</text>
  <text x="645" y="277" text-anchor="middle" font-size="7.5" fill="#546E7A">TLS</text>

  <!-- ============================================ -->
  <!-- LAYER 3 — Cloud-Schicht (Application) -->
  <!-- ============================================ -->
  <rect x="670" y="52" width="270" height="440" rx="14" fill="url(#gCloud)" stroke="#1E88E5" stroke-width="2"/>
  <!-- Header -->
  <rect x="670" y="52" width="270" height="44" rx="14" fill="#1E88E5"/>
  <rect x="670" y="76" width="270" height="20" fill="#1E88E5"/>
