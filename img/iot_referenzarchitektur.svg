<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="gDevice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43A047" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#43A047" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="gGateway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB8C00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FB8C00" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E88E5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1E88E5" stop-opacity="0.03"/>
    </linearGradient>
    <marker id="arrowR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#546E7A"/>
    </marker>
    <marker id="arrowL" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M10,0 L0,3.5 L10,7 Z" fill="#546E7A"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ============================================ -->
  <!-- Title bar -->
  <!-- ============================================ -->
  <rect x="0" y="0" width="960" height="40" rx="0" fill="#37474F"/>
  <text x="480" y="27" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff" letter-spacing="1">IoT-Referenzarchitektur — Drei-Schichten-Modell</text>

  <!-- ============================================ -->
  <!-- LAYER 1 — Geräte-Schicht (Perception) -->
  <!-- ============================================ -->
  <rect x="20" y="52" width="270" height="440" rx="14" fill="url(#gDevice)" stroke="#43A047" stroke-width="2"/>
  <!-- Header -->
  <rect x="20" y="52" width="270" height="44" rx="14" fill="#43A047"/>
  <rect x="20" y="76" width="270" height="20" fill="#43A047"/>
  <text x="155" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Geräte-Schicht</text>
  <text x="155" y="106" text-anchor="middle" font-size="10" fill="#2E7D32" font-style="italic">Perception Layer</text>

  <!-- Device cards — 2×3 grid -->
  <!-- Sensor -->
  <rect x="38" y="120" width="110" height="52" rx="8" fill="#fff" stroke="#66BB6A" stroke-width="1.2" filter="url(#shadow)"/>
  <circle cx="56" cy="140" r="8" fill="none" stroke="#43A047" stroke-width="1.5"/>
  <line x1="56" y1="136" x2="56" y2="132" stroke="#43A047" stroke-width="1.5"/>
  <line x1="56" y1="136" x2="60" y2="139" stroke="#43A047" stroke-width="1.5"/>
  <text x="105" y="141" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333">Sensoren</text>
  <text x="96" y="158" text-anchor="middle" font-size="8.5" fill="#777">Temperatur, Druck</text>

  <!-- Aktoren -->
  <rect x="162" y="120" width="110" height="52" rx="8" fill="#fff" stroke="#66BB6A" stroke-width="1.2" filter="url(#shadow)"/>
  <circle cx="180" cy="140" r="8" fill="none" stroke="#43A047" stroke-width="1.5"/>
  <path d="M176,140 L184,140 M180,136 L180,144" stroke="#43A047" stroke-width="1.5"/>
  <text x="229" y="141" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333">Aktoren</text>
  <text x="229" y="158" text-anchor="middle" font-size="8.5" fill="#777">Ventile, Motoren</text>

  <!-- Kamera -->
  <rect x="38" y="184" width="110" height="52" rx="8" fill="#fff" stroke="#66BB6A" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="48" y="200" width="14" height="10" rx="2" fill="none" stroke="#43A047" stroke-width="1.5"/>
  <circle cx="55" cy="205" r="3" fill="none" stroke="#43A047" stroke-width="1"/>
  <path d="M62,202 L68,198 L68,212 L62,208" fill="none" stroke="#43A047" stroke-width="1.2"/>
  <text x="105" y="205" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333">Kameras</text>
  <text x="100" y="222" text-anchor="middle" font-size="8.5" fill="#777">IP-Cam, CCTV</text>

