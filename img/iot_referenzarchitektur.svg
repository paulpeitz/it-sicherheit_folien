  <text x="805" y="106" text-anchor="middle" font-size="10" fill="#1565C0" font-style="italic">Application Layer</text>

  <!-- IoT Platform -->
  <rect x="690" y="120" width="230" height="55" rx="8" fill="#fff" stroke="#42A5F5" stroke-width="1.2" filter="url(#shadow)"/>
  <path d="M704,142 Q710,130 720,134 Q726,126 736,132 Q742,128 748,134 Q754,130 756,138 Q760,136 760,142 Z" fill="none" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="830" y="142" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333">IoT-Plattform</text>
  <text x="830" y="160" text-anchor="middle" font-size="9" fill="#777">AWS IoT · Azure IoT Hub</text>

  <!-- Analytics -->
  <rect x="690" y="187" width="230" height="55" rx="8" fill="#fff" stroke="#42A5F5" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="704" y="203" width="16" height="12" rx="1" fill="none" stroke="#1E88E5" stroke-width="1.2"/>
  <rect x="706" y="209" width="3" height="6" fill="#1E88E5"/>
  <rect x="711" y="206" width="3" height="9" fill="#1E88E5"/>
  <rect x="716" y="203" width="3" height="12" fill="#1E88E5"/>
  <text x="830" y="211" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333">Datenanalyse</text>
  <text x="830" y="229" text-anchor="middle" font-size="9" fill="#777">Big Data, ML, Dashboards</text>

  <!-- Applications -->
  <rect x="690" y="254" width="230" height="55" rx="8" fill="#fff" stroke="#42A5F5" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="704" y="269" width="12" height="18" rx="2" fill="none" stroke="#1E88E5" stroke-width="1.2"/>
  <circle cx="710" cy="283" r="1.5" fill="#1E88E5"/>
  <text x="830" y="278" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333">Anwendungen</text>
  <text x="830" y="296" text-anchor="middle" font-size="9" fill="#777">Mobile Apps, Web-UI, Alexa</text>

  <!-- IAM & API -->
  <rect x="690" y="321" width="230" height="55" rx="8" fill="#fff" stroke="#42A5F5" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="706" y="339" width="10" height="10" rx="1" fill="none" stroke="#1E88E5" stroke-width="1.2"/>
  <path d="M708,342 L714,342 M711,339 L711,345" stroke="#1E88E5" stroke-width="1.2"/>
  <text x="830" y="345" text-anchor="middle" font-size="11.5" font-weight="600" fill="#333">IAM &amp; REST API</text>
  <text x="830" y="363" text-anchor="middle" font-size="9" fill="#777">OAuth 2.0, Zertifikate, API-Gateways</text>

  <!-- Protocol box -->
  <rect x="690" y="390" width="230" height="42" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="805" y="407" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1565C0">Protokolle</text>
  <text x="805" y="423" text-anchor="middle" font-size="9.5" fill="#546E7A">HTTPS · REST · WebSocket · gRPC</text>

  <!-- Threat label -->
  <rect x="690" y="444" width="230" height="24" rx="5" fill="#FFEBEE" stroke="#e2001a" stroke-width="0.8"/>
  <text x="805" y="460" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">Bedrohung: API-Schwachstellen, IDOR, Cloud-Breach</text>

  <!-- ============================================ -->
  <!-- Bottom security bar -->
  <!-- ============================================ -->
  <rect x="20" y="505" width="920" height="42" rx="8" fill="#37474F"/>
  <rect x="20" y="505" width="920" height="42" rx="8" fill="none" stroke="#e2001a" stroke-width="1.5"/>
  <text x="480" y="524" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFCDD2">Angriffsfläche wächst mit jeder Schicht</text>
  <text x="480" y="540" text-anchor="middle" font-size="10" fill="#B0BEC5">Firmware-Dump  ←  Protokoll-Angriffe  ←  MitM &amp; Replay  ←  IDOR &amp; Credential Stuffing  ←  Cloud-Breach</text>
</svg>