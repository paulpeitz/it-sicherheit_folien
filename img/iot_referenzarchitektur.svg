  <rect x="162" y="184" width="110" height="52" rx="8" fill="#fff" stroke="#66BB6A" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="176" y="204" width="10" height="8" rx="1" fill="none" stroke="#43A047" stroke-width="1.5"/>
  <path d="M177,204 L177,200 A4,4 0 0,1 185,200 L185,204" fill="none" stroke="#43A047" stroke-width="1.5"/>
  <text x="229" y="205" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333">Schlösser</text>
  <text x="229" y="222" text-anchor="middle" font-size="8.5" fill="#777">Smart Locks</text>

  <!-- Licht -->
  <rect x="38" y="248" width="110" height="52" rx="8" fill="#fff" stroke="#66BB6A" stroke-width="1.2" filter="url(#shadow)"/>
  <path d="M52,270 A6,6 0 1,1 64,270" fill="none" stroke="#43A047" stroke-width="1.5"/>
  <line x1="54" y1="270" x2="54" y2="276" stroke="#43A047" stroke-width="1.2"/>
  <line x1="62" y1="270" x2="62" y2="276" stroke="#43A047" stroke-width="1.2"/>
  <line x1="53" y1="276" x2="63" y2="276" stroke="#43A047" stroke-width="1.2"/>
  <text x="105" y="269" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333">Beleuchtung</text>
  <text x="105" y="286" text-anchor="middle" font-size="8.5" fill="#777">Hue, LIFX, Zigbee</text>

  <!-- SPS/PLC -->
  <rect x="162" y="248" width="110" height="52" rx="8" fill="#fff" stroke="#66BB6A" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="174" y="262" width="16" height="12" rx="1" fill="none" stroke="#43A047" stroke-width="1.5"/>
  <line x1="177" y1="266" x2="187" y2="266" stroke="#43A047" stroke-width="1"/>
  <line x1="177" y1="270" x2="183" y2="270" stroke="#43A047" stroke-width="1"/>
  <text x="229" y="269" text-anchor="middle" font-size="10.5" font-weight="600" fill="#333">SPS / PLC</text>
  <text x="229" y="286" text-anchor="middle" font-size="8.5" fill="#777">Industriesteuerung</text>

  <!-- Protocol box -->
  <rect x="38" y="318" width="234" height="42" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="155" y="335" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2E7D32">Protokolle</text>
  <text x="155" y="351" text-anchor="middle" font-size="9.5" fill="#546E7A">BLE · Zigbee · Z-Wave · LoRa · Modbus</text>

  <!-- Constraints -->
  <rect x="38" y="372" width="234" height="52" rx="8" fill="#fff" stroke="#A5D6A7" stroke-width="1"/>
  <text x="155" y="389" text-anchor="middle" font-size="9" font-weight="600" fill="#555">Einschränkungen</text>
  <text x="155" y="404" text-anchor="middle" font-size="9" fill="#777">Wenig RAM / CPU / Batterie</text>
  <text x="155" y="417" text-anchor="middle" font-size="9" fill="#777">Oft kein vollwertiges OS, kein TLS</text>

  <!-- Threat label -->
  <rect x="38" y="434" width="234" height="24" rx="5" fill="#FFEBEE" stroke="#e2001a" stroke-width="0.8"/>
  <text x="155" y="450" text-anchor="middle" font-size="9" font-weight="bold" fill="#c62828">Bedrohung: Firmware-Manipulation, JTAG, Side-Channel</text>

  <!-- ============================================ -->
  <!-- ARROW 1 → 2  (bidirectional) -->
  <!-- ============================================ -->
  <line x1="296" y1="230" x2="340" y2="230" stroke="#546E7A" stroke-width="2" marker-end="url(#arrowR)"/>
  <line x1="340" y1="244" x2="296" y2="244" stroke="#546E7A" stroke-width="2" marker-end="url(#arrowL)"/>
  <rect x="296" y="252" width="48" height="32" rx="4" fill="#fff" stroke="#90A4AE" stroke-width="0.8"/>
  <text x="320" y="265" text-anchor="middle" font-size="7.5" fill="#546E7A">BLE</text>
  <text x="320" y="277" text-anchor="middle" font-size="7.5" fill="#546E7A">Zigbee</text>

  <!-- ============================================ -->
  <!-- LAYER 2 — Gateway-Schicht (Edge/Fog) -->
  <!-- ============================================ -->
  <rect x="345" y="52" width="270" height="440" rx="14" fill="url(#gGateway)" stroke="#FB8C00" stroke-width="2"/>
  <!-- Header -->
  <rect x="345" y="52" width="270" height="44" rx="14" fill="#FB8C00"/>
  <rect x="345" y="76" width="270" height="20" fill="#FB8C00"/>
