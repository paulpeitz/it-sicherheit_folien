<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="440" viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Data Sources (left column) -->
  <g filter="url(#shadow)">
    <rect x="15" y="20" width="140" height="36" rx="8" fill="#555"/>
    <text x="85" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Firewalls / IDS / IPS</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="15" y="68" width="140" height="36" rx="8" fill="#555"/>
    <text x="85" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Server &amp; OS Logs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="15" y="116" width="140" height="36" rx="8" fill="#555"/>
    <text x="85" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Endpoint (EDR)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="15" y="164" width="140" height="36" rx="8" fill="#555"/>
    <text x="85" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Cloud-Dienste</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="15" y="212" width="140" height="36" rx="8" fill="#555"/>
    <text x="85" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Anwendungen / DB</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="15" y="260" width="140" height="36" rx="8" fill="#555"/>
    <text x="85" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Identity (AD / IAM)</text>
  </g>

  <!-- Label: Datenquellen -->
  <text x="85" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#888">Datenquellen</text>

  <!-- Arrows from sources to SIEM -->
  <line x1="155" y1="38" x2="230" y2="120" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="155" y1="86" x2="230" y2="130" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="155" y1="134" x2="230" y2="145" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="155" y1="182" x2="230" y2="165" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="155" y1="230" x2="230" y2="180" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="155" y1="278" x2="230" y2="195" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SIEM Core (center) -->
  <g filter="url(#shadow)">
    <rect x="235" y="50" width="250" height="230" rx="14" fill="#1c3f6e"/>
    <text x="360" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">SIEM</text>

    <!-- Sub-boxes inside SIEM -->
    <rect x="255" y="95" width="210" height="36" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="360" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Sammlung &amp; Normalisierung</text>

    <rect x="255" y="143" width="210" height="36" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="360" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Korrelation &amp; Analyse</text>

    <rect x="255" y="191" width="210" height="36" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="360" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Regeln &amp; ML-Erkennung</text>

    <rect x="255" y="239" width="210" height="28" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="360" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Speicherung &amp; Retention</text>
  </g>

  <!-- Threat Intelligence Feed (top) -->
  <g filter="url(#shadow)">
    <rect x="280" y="330" width="160" height="40" rx="8" fill="#bf360c"/>
    <text x="360" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Threat Intelligence</text>
  </g>
  <line x1="360" y1="330" x2="360" y2="285" stroke="#bf360c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Output boxes (right) -->
  <g filter="url(#shadow)">
    <rect x="545" y="55" width="160" height="44" rx="10" fill="#e2001a"/>
    <text x="625" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Alerts &amp;</text>
    <text x="625" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Alarmierung</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="545" y="115" width="160" height="44" rx="10" fill="#e2001a"/>
    <text x="625" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Dashboards &amp;</text>
    <text x="625" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Visualisierung</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="545" y="175" width="160" height="44" rx="10" fill="#e2001a"/>
    <text x="625" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Compliance &amp;</text>
    <text x="625" y="209" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Reporting</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="545" y="235" width="160" height="44" rx="10" fill="#2e7d32"/>
    <text x="625" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">SOAR &amp;</text>
    <text x="625" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Automatisierung</text>
  </g>

  <!-- Arrows from SIEM to outputs -->
  <line x1="485" y1="100" x2="540" y2="80" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="485" y1="140" x2="540" y2="137" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="485" y1="180" x2="540" y2="195" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="485" y1="220" x2="540" y2="255" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="625" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#888">Ausgaben</text>

  <!-- SOC label -->
  <g>
    <rect x="545" y="345" width="160" height="40" rx="8" fill="#1c3f6e" opacity="0.7"/>
    <text x="625" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">SOC-Team</text>
  </g>
  <line x1="625" y1="345" x2="625" y2="284" stroke="#1c3f6e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
</svg>