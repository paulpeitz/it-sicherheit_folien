<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Phase 1: Erkennung (top-center) -->
  <g filter="url(#shadow)">
    <rect x="280" y="15" width="160" height="56" rx="10" fill="#e2001a"/>
    <text x="360" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">1. Erkennung</text>
    <text x="360" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">Scanner, CERT, Hersteller</text>
  </g>

  <!-- Phase 2: Bewertung (top-right) -->
  <g filter="url(#shadow)">
    <rect x="530" y="95" width="160" height="56" rx="10" fill="#1c3f6e"/>
    <text x="610" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">2. Bewertung</text>
    <text x="610" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">CVSS, EPSS, Business Impact</text>
  </g>

  <!-- Phase 3: Planung (right) -->
  <g filter="url(#shadow)">
    <rect x="560" y="200" width="150" height="56" rx="10" fill="#1c3f6e"/>
    <text x="635" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">3. Planung</text>
    <text x="635" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">Change, Rollback, Fenster</text>
  </g>

  <!-- Phase 4: Test (bottom-right) -->
  <g filter="url(#shadow)">
    <rect x="490" y="310" width="150" height="56" rx="10" fill="#1c3f6e"/>
    <text x="565" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">4. Test</text>
    <text x="565" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">Staging, Smoke Tests</text>
  </g>

  <!-- Phase 5: Rollout (bottom-left) -->
  <g filter="url(#shadow)">
    <rect x="80" y="310" width="150" height="56" rx="10" fill="#1c3f6e"/>
    <text x="155" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">5. Rollout</text>
    <text x="155" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">Phasenweise, automatisiert</text>
  </g>

  <!-- Phase 6: Verifikation (left) -->
  <g filter="url(#shadow)">
    <rect x="10" y="200" width="150" height="56" rx="10" fill="#1c3f6e"/>
    <text x="85" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">6. Verifikation</text>
    <text x="85" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">Scan, Logs, Monitoring</text>
  </g>

  <!-- Phase 7: Dokumentation (top-left) -->
  <g filter="url(#shadow)">
    <rect x="30" y="95" width="160" height="56" rx="10" fill="#2e7d32"/>
    <text x="110" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">7. Dokumentation</text>
    <text x="110" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">KPIs, Compliance, Audit</text>
  </g>

  <!-- Arrows (clockwise) -->
  <!-- 1 → 2 -->
  <line x1="440" y1="50" x2="525" y2="105" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 2 → 3 -->
  <line x1="640" y1="151" x2="640" y2="195" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 3 → 4 -->
  <line x1="625" y1="256" x2="590" y2="305" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 4 → 5 -->
  <line x1="490" y1="340" x2="235" y2="340" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 5 → 6 -->
  <line x1="105" y1="310" x2="80" y2="261" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 6 → 7 -->
  <line x1="85" y1="200" x2="95" y2="156" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 7 → 1 (completing the cycle) -->
  <line x1="190" y1="108" x2="275" y2="55" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Center label -->
  <text x="360" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666">Kontinuierlicher</text>
  <text x="360" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666">Prozess</text>
</svg>