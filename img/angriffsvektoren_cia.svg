<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Angriffsvektoren → Betroffene Schutzziele</text>

  <!-- Header Row -->
  <g transform="translate(0, 55)">
    <rect x="20" y="0" width="200" height="40" rx="6" fill="#424242"/>
    <text x="120" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Angriffsvektor</text>

    <rect x="230" y="0" width="170" height="40" rx="6" fill="#1565c0"/>
    <text x="315" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="white">C – Vertraulichkeit</text>

    <rect x="410" y="0" width="170" height="40" rx="6" fill="#e65100"/>
    <text x="495" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="white">I – Integrität</text>

    <rect x="590" y="0" width="170" height="40" rx="6" fill="#2e7d32"/>
    <text x="675" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="white">A – Verfügbarkeit</text>
  </g>

  <!-- Row 1: Ransomware -->
  <g transform="translate(0, 105)">
    <rect x="20" y="0" width="200" height="42" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <text x="120" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Ransomware</text>
    <text x="120" y="33" text-anchor="middle" font-size="9" fill="#888">z.B. WannaCry, LockBit</text>
    <rect x="230" y="0" width="170" height="42" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="315" cy="21" r="12" fill="#1565c0"/><text x="315" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
    <rect x="410" y="0" width="170" height="42" rx="4" fill="#fff3e0" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="495" cy="21" r="12" fill="#e65100"/><text x="495" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
    <rect x="590" y="0" width="170" height="42" rx="4" fill="#e8f5e9" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="675" cy="21" r="12" fill="#2e7d32"/><text x="675" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
  </g>

  <!-- Row 2: Phishing -->
  <g transform="translate(0, 155)">
    <rect x="20" y="0" width="200" height="42" rx="4" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
    <text x="120" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Phishing</text>
    <text x="120" y="33" text-anchor="middle" font-size="9" fill="#888">Credential Theft</text>
    <rect x="230" y="0" width="170" height="42" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="315" cy="21" r="12" fill="#1565c0"/><text x="315" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
    <rect x="410" y="0" width="170" height="42" rx="4" fill="#fff8e1" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="495" cy="21" r="12" fill="#e0e0e0"/><text x="495" y="26" text-anchor="middle" font-size="12" fill="#aaa">○</text>
    <rect x="590" y="0" width="170" height="42" rx="4" fill="#f1f8e9" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="675" cy="21" r="12" fill="#e0e0e0"/><text x="675" y="26" text-anchor="middle" font-size="12" fill="#aaa">○</text>
  </g>

  <!-- Row 3: DDoS -->
  <g transform="translate(0, 205)">
    <rect x="20" y="0" width="200" height="42" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <text x="120" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">DDoS-Angriff</text>
    <text x="120" y="33" text-anchor="middle" font-size="9" fill="#888">Volumetric / Application</text>
    <rect x="230" y="0" width="170" height="42" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="315" cy="21" r="12" fill="#e0e0e0"/><text x="315" y="26" text-anchor="middle" font-size="12" fill="#aaa">○</text>
    <rect x="410" y="0" width="170" height="42" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="495" cy="21" r="12" fill="#e0e0e0"/><text x="495" y="26" text-anchor="middle" font-size="12" fill="#aaa">○</text>
    <rect x="590" y="0" width="170" height="42" rx="4" fill="#e8f5e9" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="675" cy="21" r="12" fill="#2e7d32"/><text x="675" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
  </g>

  <!-- Row 4: SQL Injection -->
  <g transform="translate(0, 255)">
    <rect x="20" y="0" width="200" height="42" rx="4" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
    <text x="120" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">SQL Injection</text>
    <text x="120" y="33" text-anchor="middle" font-size="9" fill="#888">Datenexfiltration/Manipulation</text>
    <rect x="230" y="0" width="170" height="42" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="315" cy="21" r="12" fill="#1565c0"/><text x="315" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
    <rect x="410" y="0" width="170" height="42" rx="4" fill="#fff3e0" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="495" cy="21" r="12" fill="#e65100"/><text x="495" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
    <rect x="590" y="0" width="170" height="42" rx="4" fill="#f1f8e9" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="675" cy="21" r="12" fill="#e0e0e0"/><text x="675" y="26" text-anchor="middle" font-size="12" fill="#aaa">○</text>
  </g>

  <!-- Row 5: Supply Chain Attack -->
  <g transform="translate(0, 305)">
    <rect x="20" y="0" width="200" height="42" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <text x="120" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Supply-Chain-Angriff</text>
    <text x="120" y="33" text-anchor="middle" font-size="9" fill="#888">z.B. SolarWinds, xz-utils</text>
    <rect x="230" y="0" width="170" height="42" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="315" cy="21" r="12" fill="#1565c0"/><text x="315" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
    <rect x="410" y="0" width="170" height="42" rx="4" fill="#fff3e0" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="495" cy="21" r="12" fill="#e65100"/><text x="495" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
    <rect x="590" y="0" width="170" height="42" rx="4" fill="#e8f5e9" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="675" cy="21" r="12" fill="#2e7d32"/><text x="675" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
  </g>

  <!-- Row 6: Man-in-the-Middle -->
  <g transform="translate(0, 355)">
    <rect x="20" y="0" width="200" height="42" rx="4" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
    <text x="120" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Man-in-the-Middle</text>
    <text x="120" y="33" text-anchor="middle" font-size="9" fill="#888">ARP Spoofing, SSL Strip</text>
    <rect x="230" y="0" width="170" height="42" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="315" cy="21" r="12" fill="#1565c0"/><text x="315" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
    <rect x="410" y="0" width="170" height="42" rx="4" fill="#fff3e0" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="495" cy="21" r="12" fill="#e65100"/><text x="495" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
    <rect x="590" y="0" width="170" height="42" rx="4" fill="#f1f8e9" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="675" cy="21" r="12" fill="#e0e0e0"/><text x="675" y="26" text-anchor="middle" font-size="12" fill="#aaa">○</text>
  </g>

  <!-- Row 7: Insider Threat -->
  <g transform="translate(0, 405)">
    <rect x="20" y="0" width="200" height="42" rx="4" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1"/>
    <text x="120" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Insider Threat</text>
    <text x="120" y="33" text-anchor="middle" font-size="9" fill="#888">Sabotage, Datendiebstahl</text>
    <rect x="230" y="0" width="170" height="42" rx="4" fill="#e3f2fd" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="315" cy="21" r="12" fill="#1565c0"/><text x="315" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
    <rect x="410" y="0" width="170" height="42" rx="4" fill="#fff3e0" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="495" cy="21" r="12" fill="#e65100"/><text x="495" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
    <rect x="590" y="0" width="170" height="42" rx="4" fill="#e8f5e9" stroke="#e0e0e0" stroke-width="1"/>
    <circle cx="675" cy="21" r="12" fill="#2e7d32"/><text x="675" y="26" text-anchor="middle" font-size="14" fill="white">●</text>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 470)">
    <rect x="0" y="0" width="760" height="40" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
    <circle cx="30" cy="20" r="10" fill="#333"/>
    <text x="30" y="25" text-anchor="middle" font-size="12" fill="white">●</text>
    <text x="48" y="25" font-size="11" fill="#333">= Schutzziel direkt betroffen</text>
    <circle cx="260" cy="20" r="10" fill="#e0e0e0"/>
    <text x="260" y="25" text-anchor="middle" font-size="10" fill="#aaa">○</text>
    <text x="278" y="25" font-size="11" fill="#333">= selten oder indirekt betroffen</text>
    <text x="720" y="25" text-anchor="end" font-size="10" fill="#aaa">Quelle: MITRE ATT&amp;CK / OWASP</text>
  </g>
</svg>