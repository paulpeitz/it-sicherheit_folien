<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <style>
      .label { font-family: Arial, sans-serif; font-size: 13px; fill: #333; text-anchor: middle; }
      .label-bold { font-family: Arial, sans-serif; font-size: 15px; text-anchor: middle; font-weight: bold; }
      .label-small { font-family: Arial, sans-serif; font-size: 11px; fill: #555; text-anchor: start; }
      .label-white { font-family: Arial, sans-serif; font-size: 14px; fill: #fff; text-anchor: middle; font-weight: bold; }
    </style>
  </defs>

  <!-- Balance beam / Waage -->
  <!-- Fulcrum (triangle) -->
  <polygon points="400,320 370,380 430,380" fill="#888" stroke="#666" stroke-width="1.5"/>
  
  <!-- Base -->
  <rect x="340" y="380" width="120" height="12" rx="3" fill="#aaa"/>

  <!-- Beam (slightly tilted to show tension) -->
  <line x1="120" y1="290" x2="680" y2="290" stroke="#666" stroke-width="4" stroke-linecap="round"/>

  <!-- Left pan: Datenschutz -->
  <line x1="170" y1="290" x2="170" y2="310" stroke="#666" stroke-width="2"/>
  <line x1="120" y1="290" x2="120" y2="310" stroke="#666" stroke-width="2"/>
  <line x1="220" y1="290" x2="220" y2="310" stroke="#666" stroke-width="2"/>
  
  <rect x="70" y="310" width="200" height="150" rx="10" fill="#e2001a" opacity="0.1" stroke="#e2001a" stroke-width="2"/>
  
  <!-- Shield icon area -->
  <rect x="100" y="85" width="140" height="40" rx="6" fill="#e2001a"/>
  <text x="170" y="111" class="label-white">Datenschutz</text>
  
  <!-- Connecting line -->
  <line x1="170" y1="125" x2="170" y2="290" stroke="#e2001a" stroke-width="2" stroke-dasharray="5,3"/>
  
  <text x="90" y="340" class="label-small" fill="#e2001a" font-weight="bold">Grundrechte:</text>
  <text x="90" y="360" class="label-small">• Informationelle Selbstbestimmung</text>
  <text x="90" y="378" class="label-small">• Fernmeldegeheimnis</text>
  <text x="90" y="396" class="label-small">• Privatsphäre</text>
  <text x="90" y="420" class="label-small" fill="#e2001a" font-weight="bold">Instrumente:</text>
  <text x="90" y="438" class="label-small">• Verschlüsselung</text>
  <text x="90" y="454" class="label-small">• Datenminimierung</text>

  <!-- Right pan: Ermittlungsinteressen -->
  <line x1="580" y1="290" x2="580" y2="310" stroke="#666" stroke-width="2"/>
  <line x1="630" y1="290" x2="630" y2="310" stroke="#666" stroke-width="2"/>
  <line x1="680" y1="290" x2="680" y2="310" stroke="#666" stroke-width="2"/>
  
  <rect x="530" y="310" width="200" height="150" rx="10" fill="#1a5276" opacity="0.1" stroke="#1a5276" stroke-width="2"/>
  
  <rect x="560" y="85" width="140" height="40" rx="6" fill="#1a5276"/>
  <text x="630" y="111" class="label-white">Sicherheit</text>
  
  <!-- Connecting line -->
  <line x1="630" y1="125" x2="630" y2="290" stroke="#1a5276" stroke-width="2" stroke-dasharray="5,3"/>
  
  <text x="550" y="340" class="label-small" fill="#1a5276" font-weight="bold">Befugnisse:</text>
  <text x="550" y="360" class="label-small">• TKÜ &amp; Quellen-TKÜ</text>
  <text x="550" y="378" class="label-small">• Online-Durchsuchung</text>
  <text x="550" y="396" class="label-small">• Vorratsdatenspeicherung</text>
  <text x="550" y="420" class="label-small" fill="#1a5276" font-weight="bold">Ziele:</text>
  <text x="550" y="438" class="label-small">• Strafverfolgung</text>
  <text x="550" y="454" class="label-small">• Terrorismusbekämpfung</text>

  <!-- Center: Tension -->
  <text x="400" y="50" class="label-bold" fill="#e2001a">Verhältnismäßigkeit</text>
  <text x="400" y="70" class="label" fill="#888">Gesetzesgrundlage · Richterlicher Beschluss · Zweckbindung</text>

  <!-- Double arrow in center -->
  <line x1="310" y1="250" x2="490" y2="250" stroke="#999" stroke-width="1.5" marker-start="url(#leftArr)" marker-end="url(#rightArr)"/>
  <text x="400" y="270" class="label" fill="#999">Spannungsfeld</text>

  <defs>
    <marker id="leftArr" markerWidth="7" markerHeight="5" refX="0" refY="2.5" orient="auto">
      <polygon points="7 0, 0 2.5, 7 5" fill="#999"/>
    </marker>
    <marker id="rightArr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#999"/>
    </marker>
  </defs>
</svg>