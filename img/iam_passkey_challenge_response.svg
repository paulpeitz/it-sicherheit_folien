<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400">
  <defs>
    <marker id="arrPK" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444"/>
    </marker>
    <marker id="arrPKr" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#276749"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" fill="#2d3748" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">Passkey – Challenge-Response-Verfahren</text>

  <!-- Actors -->
  <rect x="20" y="42" width="130" height="34" rx="8" fill="#1c3f6e"/>
  <text x="85" y="64" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Nutzer / Gerät</text>

  <rect x="295" y="42" width="130" height="34" rx="8" fill="#e8a520"/>
  <text x="360" y="64" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Browser</text>

  <rect x="570" y="42" width="130" height="34" rx="8" fill="#276749"/>
  <text x="635" y="64" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Server (RP)</text>

  <!-- Vertical lifelines -->
  <line x1="85" y1="78" x2="85" y2="380" stroke="#1c3f6e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="360" y1="78" x2="360" y2="380" stroke="#e8a520" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="635" y1="78" x2="635" y2="380" stroke="#276749" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Registration Phase Header -->
  <rect x="180" y="90" width="360" height="20" rx="4" fill="#f0f0f0"/>
  <text x="360" y="104" text-anchor="middle" fill="#888" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">REGISTRIERUNG (einmalig)</text>

  <!-- Step R1: Server → Browser: Challenge -->
  <line x1="632" y1="125" x2="363" y2="125" stroke="#276749" stroke-width="1.5" marker-end="url(#arrPKr)"/>
  <text x="497" y="120" text-anchor="middle" fill="#276749" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">1. Challenge senden</text>

  <!-- Step R2: Browser → Gerät: Create Keypair -->
  <line x1="357" y1="148" x2="88" y2="148" stroke="#e8a520" stroke-width="1.5"/>
  <polygon points="90,144.5 78,148 90,151.5" fill="#e8a520"/>
  <text x="222" y="143" text-anchor="middle" fill="#e8a520" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">2. Schlüsselpaar erzeugen</text>

  <!-- Step R3: Biometrie -->
  <rect x="30" y="160" width="110" height="22" rx="4" fill="#fff3cd" stroke="#e8a520" stroke-width="1"/>
  <text x="85" y="175" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="8">FaceID / Fingerabdruck</text>

  <!-- Step R4: Gerät → Browser → Server: Public Key -->
  <line x1="88" y1="195" x2="632" y2="195" stroke="#444" stroke-width="1.5" marker-end="url(#arrPK)"/>
  <text x="360" y="190" text-anchor="middle" fill="#444" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">3. Public Key senden (Private Key bleibt lokal!)</text>

  <!-- Login Phase Header -->
  <rect x="180" y="220" width="360" height="20" rx="4" fill="#f0f0f0"/>
  <text x="360" y="234" text-anchor="middle" fill="#888" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">LOGIN (jedes Mal)</text>

  <!-- Step L1: Server → Browser: Challenge -->
  <line x1="632" y1="258" x2="363" y2="258" stroke="#276749" stroke-width="1.5" marker-end="url(#arrPKr)"/>
  <text x="497" y="253" text-anchor="middle" fill="#276749" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">4. Neue Challenge senden</text>

  <!-- Step L2: Browser → Gerät: Sign -->
  <line x1="357" y1="280" x2="88" y2="280" stroke="#e8a520" stroke-width="1.5"/>
  <polygon points="90,276.5 78,280 90,283.5" fill="#e8a520"/>
  <text x="222" y="275" text-anchor="middle" fill="#e8a520" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">5. Lokale Verifizierung</text>

  <!-- Step L3: Biometrie -->
  <rect x="30" y="292" width="110" height="22" rx="4" fill="#fff3cd" stroke="#e8a520" stroke-width="1"/>
  <text x="85" y="307" text-anchor="middle" fill="#555" font-family="Segoe UI, Arial, sans-serif" font-size="8">FaceID / Fingerabdruck</text>

  <!-- Step L4: Gerät → Server: Signatur -->
  <line x1="88" y1="328" x2="632" y2="328" stroke="#444" stroke-width="1.5" marker-end="url(#arrPK)"/>
  <text x="360" y="323" text-anchor="middle" fill="#444" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold">6. Signierte Challenge senden (NICHT den Private Key!)</text>

  <!-- Step L5: Server validates -->
  <rect x="575" y="340" width="120" height="22" rx="4" fill="#276749"/>
  <text x="635" y="355" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="bold">7. Signatur prüfen → OK</text>

  <!-- Origin Binding Note -->
  <rect x="5" y="368" width="710" height="22" rx="11" fill="#2d3748"/>
  <text x="360" y="383" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold">Origin Binding: Passkey ist an die Domain gebunden → Phishing-resistent</text>
</svg>