<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <filter id="shadow6" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2001a"/>
      <stop offset="100%" stop-color="#b3001a"/>
    </linearGradient>
    <marker id="arr6" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
  </defs>

  <rect width="900" height="500" rx="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="900" height="52" rx="12" fill="url(#headerGrad6)"/>
  <rect y="40" width="900" height="12" fill="url(#headerGrad6)"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">TOR – Onion Routing (Vereinfacht)</text>

  <!-- Key exchange info -->
  <text x="450" y="78" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#7f8c8d">Jeder Knoten kennt nur seinen direkten Vorgänger und Nachfolger</text>

  <!-- User -->
  <rect x="30" y="140" width="100" height="80" rx="8" fill="#fff" stroke="#2c3e50" stroke-width="2" filter="url(#shadow6)"/>
  <rect x="55" y="150" width="50" height="32" rx="3" fill="#d5dbdb"/>
  <rect x="65" y="186" width="30" height="14" rx="2" fill="#d5dbdb"/>
  <text x="80" y="235" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#2c3e50">Nutzer</text>
  <text x="80" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#3498db">Tor Browser</text>

  <!-- Entry Node -->
  <rect x="195" y="140" width="120" height="80" rx="8" fill="#27ae60" filter="url(#shadow6)"/>
  <text x="255" y="170" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Entry Node</text>
  <text x="255" y="190" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#e8f8f0">(Guard)</text>
  <text x="255" y="208" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#c8f0d8">Schlüssel K₁</text>

  <!-- Middle Node -->
  <rect x="380" y="140" width="120" height="80" rx="8" fill="#f39c12" filter="url(#shadow6)"/>
  <text x="440" y="170" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Middle Node</text>
  <text x="440" y="190" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#fef9e7">(Relay)</text>
  <text x="440" y="208" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#fce8b8">Schlüssel K₂</text>

  <!-- Exit Node -->
  <rect x="565" y="140" width="120" height="80" rx="8" fill="#e74c3c" filter="url(#shadow6)"/>
  <text x="625" y="170" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Exit Node</text>
  <text x="625" y="190" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#fde8e8">(Ausgang)</text>
  <text x="625" y="208" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#f5b7b1">Schlüssel K₃</text>

  <!-- Destination -->
  <rect x="750" y="140" width="120" height="80" rx="8" fill="#fff" stroke="#2c3e50" stroke-width="2" filter="url(#shadow6)"/>
  <rect x="775" y="155" width="70" height="40" rx="4" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="785" y1="170" x2="835" y2="170" stroke="#bdc3c7" stroke-width="1"/>
  <line x1="785" y1="180" x2="835" y2="180" stroke="#bdc3c7" stroke-width="1"/>
  <text x="810" y="235" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#2c3e50">Zielserver</text>
  <text x="810" y="250" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#7f8c8d">example.com</text>

  <!-- Connection arrows -->
  <line x1="130" y1="180" x2="190" y2="180" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr6)"/>
  <line x1="315" y1="180" x2="375" y2="180" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr6)"/>
  <line x1="500" y1="180" x2="560" y2="180" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr6)"/>
  <line x1="685" y1="180" x2="745" y2="180" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- Encryption layers visualization -->
  <text x="450" y="285" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#2c3e50">Verschlüsselungsschichten (Onion Layers)</text>

  <!-- Layer 1 (outermost) - at user -->
  <rect x="40" y="305" width="600" height="70" rx="35" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="2"/>
  <text x="65" y="345" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#27ae60">K₁ verschlüsselt</text>

  <!-- Layer 2 -->
  <rect x="205" y="315" width="435" height="50" rx="25" fill="#f39c12" opacity="0.15" stroke="#f39c12" stroke-width="2"/>
  <text x="230" y="345" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#c27d0e">K₂ verschlüsselt</text>

  <!-- Layer 3 (innermost) -->
  <rect x="390" y="325" width="250" height="30" rx="15" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="2"/>
  <text x="440" y="345" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#e74c3c">K₃</text>

  <!-- Data -->
  <rect x="520" y="330" width="100" height="20" rx="10" fill="#2c3e50"/>
  <text x="570" y="345" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#fff">Daten</text>

  <!-- Decryption labels -->
  <text x="150" y="400" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#27ae60">Entry entfernt Schicht 1</text>
  <text x="380" y="400" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#c27d0e">Middle entfernt Schicht 2</text>
  <text x="600" y="400" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e74c3c">Exit entfernt Schicht 3</text>

  <!-- Arrows -->
  <line x1="150" y1="380" x2="150" y2="370" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="380" y1="380" x2="380" y2="370" stroke="#f39c12" stroke-width="1.5"/>
  <line x1="600" y1="380" x2="600" y2="370" stroke="#e74c3c" stroke-width="1.5"/>

  <!-- Knowledge table -->
  <rect x="40" y="420" width="820" height="60" rx="8" fill="#fff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow6)"/>
  <text x="60" y="442" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#2c3e50">Wissen der Knoten:</text>
  <text x="60" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#27ae60">Entry: kennt Nutzer-IP, nicht das Ziel</text>
  <text x="340" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#c27d0e">Middle: kennt weder Nutzer noch Ziel</text>
  <text x="630" y="462" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e74c3c">Exit: kennt Ziel, nicht den Nutzer</text>
</svg>