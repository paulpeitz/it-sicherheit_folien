<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2001a"/>
      <stop offset="100%" stop-color="#b3001a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" rx="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="900" height="52" rx="12" fill="url(#headerGrad4)"/>
  <rect y="40" width="900" height="12" fill="url(#headerGrad4)"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Firewall-Typen im Vergleich</text>

  <!-- Column 1: Packet Filter -->
  <rect x="30" y="70" width="270" height="420" rx="10" fill="#fff" stroke="#3498db" stroke-width="2" filter="url(#shadow4)"/>
  <rect x="30" y="70" width="270" height="50" rx="10" fill="#3498db"/>
  <rect x="30" y="100" width="270" height="20" fill="#3498db"/>
  <text x="165" y="100" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Packet Filter</text>
  <text x="165" y="116" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#ebf5fb">(Stateless)</text>

  <!-- OSI layers L3-L4 -->
  <rect x="55" y="135" width="220" height="28" rx="5" fill="#ebf5fb" stroke="#3498db" stroke-width="1"/>
  <text x="165" y="154" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#2471a3">Layer 3 + 4</text>

  <rect x="55" y="175" width="220" height="90" rx="5" fill="#f8f9fa"/>
  <text x="65" y="193" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#2c3e50">Prüft:</text>
  <text x="65" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Quell-/Ziel-IP</text>
  <text x="65" y="227" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Quell-/Ziel-Port</text>
  <text x="65" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Protokolltyp (TCP/UDP)</text>

  <rect x="55" y="278" width="220" height="60" rx="5" fill="#e8f8f0" stroke="#27ae60" stroke-width="1"/>
  <text x="65" y="296" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#1e8449">Vorteile:</text>
  <text x="65" y="313" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Extrem schnell</text>
  <text x="65" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Geringer Ressourcenbedarf</text>

  <rect x="55" y="350" width="220" height="60" rx="5" fill="#fdf2f2" stroke="#e2001a" stroke-width="1"/>
  <text x="65" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#c0392b">Nachteile:</text>
  <text x="65" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Kein Verbindungskontext</text>
  <text x="65" y="402" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Kein Inhalts-Scan</text>

  <!-- Speed indicator -->
  <rect x="55" y="422" width="220" height="28" rx="5" fill="#f5f5f5"/>
  <text x="75" y="441" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">Performance:</text>
  <rect x="160" y="433" width="100" height="8" rx="4" fill="#ddd"/>
  <rect x="160" y="433" width="95" height="8" rx="4" fill="#27ae60"/>
  <text x="265" y="441" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#27ae60">★★★</text>

  <!-- Column 2: Stateful Inspection -->
  <rect x="315" y="70" width="270" height="420" rx="10" fill="#fff" stroke="#f39c12" stroke-width="2" filter="url(#shadow4)"/>
  <rect x="315" y="70" width="270" height="50" rx="10" fill="#f39c12"/>
  <rect x="315" y="100" width="270" height="20" fill="#f39c12"/>
  <text x="450" y="100" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Stateful Inspection</text>
  <text x="450" y="116" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fef9e7">(Standard heute)</text>

  <rect x="340" y="135" width="220" height="28" rx="5" fill="#fef9e7" stroke="#f39c12" stroke-width="1"/>
  <text x="450" y="154" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#c27d0e">Layer 3 + 4 + State</text>

  <rect x="340" y="175" width="220" height="90" rx="5" fill="#f8f9fa"/>
  <text x="350" y="193" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#2c3e50">Prüft zusätzlich:</text>
  <text x="350" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Verbindungszustand</text>
  <text x="350" y="227" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• TCP-Flags (SYN/ACK/FIN)</text>
  <text x="350" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Sequenznummern</text>

  <rect x="340" y="278" width="220" height="60" rx="5" fill="#e8f8f0" stroke="#27ae60" stroke-width="1"/>
  <text x="350" y="296" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#1e8449">Vorteile:</text>
  <text x="350" y="313" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Erkennt Verbindungen</text>
  <text x="350" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Antworten auto. erlaubt</text>

  <rect x="340" y="350" width="220" height="60" rx="5" fill="#fdf2f2" stroke="#e2001a" stroke-width="1"/>
  <text x="350" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#c0392b">Nachteile:</text>
  <text x="350" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Kein Content-Scan</text>
  <text x="350" y="402" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Ressourcenintensiver</text>

  <rect x="340" y="422" width="220" height="28" rx="5" fill="#f5f5f5"/>
  <text x="360" y="441" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">Performance:</text>
  <rect x="445" y="433" width="100" height="8" rx="4" fill="#ddd"/>
  <rect x="445" y="433" width="65" height="8" rx="4" fill="#f39c12"/>
  <text x="550" y="441" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#f39c12">★★☆</text>

  <!-- Column 3: NGFW -->
  <rect x="600" y="70" width="270" height="420" rx="10" fill="#fff" stroke="#8e44ad" stroke-width="2" filter="url(#shadow4)"/>
  <rect x="600" y="70" width="270" height="50" rx="10" fill="#8e44ad"/>
  <rect x="600" y="100" width="270" height="20" fill="#8e44ad"/>
  <text x="735" y="100" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">NGFW / Proxy</text>
  <text x="735" y="116" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#f4ecf7">(Next Generation)</text>

  <rect x="625" y="135" width="220" height="28" rx="5" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1"/>
  <text x="735" y="154" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#7d3c98">Layer 3–7 + DPI + IPS</text>

  <rect x="625" y="175" width="220" height="90" rx="5" fill="#f8f9fa"/>
  <text x="635" y="193" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#2c3e50">Prüft zusätzlich:</text>
  <text x="635" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Applikationsinhalte (DPI)</text>
  <text x="635" y="227" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Benutzer-Identität</text>
  <text x="635" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Bekannte Angriffsmuster</text>

  <rect x="625" y="278" width="220" height="60" rx="5" fill="#e8f8f0" stroke="#27ae60" stroke-width="1"/>
  <text x="635" y="296" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#1e8449">Vorteile:</text>
  <text x="635" y="313" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Content-Inspektion</text>
  <text x="635" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• App-Erkennung, IPS</text>

  <rect x="625" y="350" width="220" height="60" rx="5" fill="#fdf2f2" stroke="#e2001a" stroke-width="1"/>
  <text x="635" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#c0392b">Nachteile:</text>
  <text x="635" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• Hoher Ressourcenbedarf</text>
  <text x="635" y="402" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">• TLS-Interception nötig</text>

  <rect x="625" y="422" width="220" height="28" rx="5" fill="#f5f5f5"/>
  <text x="645" y="441" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#555">Performance:</text>
  <rect x="730" y="433" width="100" height="8" rx="4" fill="#ddd"/>
  <rect x="730" y="433" width="35" height="8" rx="4" fill="#e74c3c"/>
  <text x="835" y="441" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#e74c3c">★☆☆</text>
</svg>