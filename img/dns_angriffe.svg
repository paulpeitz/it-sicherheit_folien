<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <filter id="shadow10" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2001a"/>
      <stop offset="100%" stop-color="#b3001a"/>
    </linearGradient>
    <marker id="arr10" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
    <marker id="arr10r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e2001a"/>
    </marker>
    <marker id="arr10g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect width="900" height="500" rx="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="900" height="52" rx="12" fill="url(#headerGrad10)"/>
  <rect y="40" width="900" height="12" fill="url(#headerGrad10)"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">DNS-Angriffe: Spoofing &amp; Cache Poisoning</text>

  <!-- TOP SECTION: Normal DNS -->
  <rect x="30" y="65" width="840" height="28" rx="6" fill="#27ae60"/>
  <text x="450" y="84" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Normaler DNS-Ablauf</text>

  <!-- Client -->
  <rect x="50" y="105" width="90" height="60" rx="6" fill="#fff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow10)"/>
  <rect x="67" y="113" width="56" height="25" rx="3" fill="#d5dbdb"/>
  <text x="95" y="158" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#2c3e50">Client</text>

  <!-- Recursive DNS -->
  <rect x="250" y="105" width="130" height="60" rx="6" fill="#3498db" filter="url(#shadow10)"/>
  <text x="315" y="133" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#fff">DNS-Resolver</text>
  <text x="315" y="150" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#d6eaf8">(Rekursiv)</text>

  <!-- Auth DNS -->
  <rect x="490" y="105" width="130" height="60" rx="6" fill="#2c3e50" filter="url(#shadow10)"/>
  <text x="555" y="133" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#fff">Auth. DNS-Server</text>
  <text x="555" y="150" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#d5dbdb">bank.de</text>

  <!-- Normal flow arrows -->
  <line x1="140" y1="125" x2="245" y2="125" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr10g)"/>
  <text x="192" y="118" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#27ae60">bank.de → ?</text>

  <line x1="380" y1="125" x2="485" y2="125" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr10g)"/>

  <line x1="485" y1="145" x2="380" y2="145" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr10g)"/>
  <text x="432" y="158" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#27ae60">→ 93.184.1.1</text>

  <line x1="245" y1="145" x2="140" y2="145" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr10g)"/>
  <text x="192" y="158" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#27ae60">93.184.1.1 ✓</text>

  <!-- Cache box -->
  <rect x="690" y="105" width="140" height="60" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
  <text x="760" y="128" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#1e8449">DNS-Cache</text>
  <text x="760" y="148" text-anchor="middle" font-family="Segoe UI,monospace" font-size="10" fill="#2c3e50">bank.de → 93.184.1.1</text>
  <line x1="620" y1="135" x2="685" y2="135" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- BOTTOM: DNS Cache Poisoning -->
  <rect x="30" y="185" width="840" height="28" rx="6" fill="#e2001a"/>
  <text x="450" y="204" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">DNS Cache Poisoning (Angriff)</text>

  <!-- Step 1 -->
  <circle cx="55" cy="238" r="14" fill="#e2001a"/>
  <text x="55" y="243" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="75" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#2c3e50">Client fragt DNS-Resolver nach bank.de</text>

  <!-- Client bottom -->
  <rect x="50" y="260" width="90" height="60" rx="6" fill="#fff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow10)"/>
  <rect x="67" y="268" width="56" height="25" rx="3" fill="#d5dbdb"/>
  <text x="95" y="315" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#2c3e50">Client</text>

  <!-- Resolver bottom -->
  <rect x="250" y="260" width="130" height="60" rx="6" fill="#3498db" filter="url(#shadow10)"/>
  <text x="315" y="288" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#fff">DNS-Resolver</text>
  <text x="315" y="305" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#d6eaf8">(Rekursiv)</text>

  <!-- Auth DNS bottom -->
  <rect x="490" y="260" width="130" height="60" rx="6" fill="#2c3e50" filter="url(#shadow10)"/>
  <text x="555" y="288" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#fff">Auth. DNS-Server</text>
  <text x="555" y="305" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#d5dbdb">bank.de</text>

  <!-- Attacker -->
  <rect x="370" y="365" width="120" height="65" rx="8" fill="#fdf2f2" stroke="#e2001a" stroke-width="2" filter="url(#shadow10)"/>
  <rect x="395" y="373" width="70" height="28" rx="3" fill="#e2001a" opacity="0.15"/>
  <text x="430" y="425" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#e2001a">Angreifer</text>

  <!-- Step flow arrows -->
  <line x1="140" y1="280" x2="245" y2="280" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr10)"/>
  <text x="192" y="273" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#2c3e50">bank.de → ?</text>

  <line x1="380" y1="280" x2="485" y2="280" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arr10)"/>

  <!-- Step 2 -->
  <circle cx="55" cy="352" r="14" fill="#e2001a"/>
  <text x="55" y="357" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="75" y="356" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#e2001a">Angreifer flutet Resolver mit gefälschten Antworten (Race Condition)</text>

  <!-- Fake response arrows -->
  <line x1="380" y1="380" x2="340" y2="325" stroke="#e2001a" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arr10r)"/>
  <text x="330" y="365" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" fill="#e2001a">Gefälschte Antwort</text>
  <text x="330" y="380" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#e2001a">bank.de → 6.6.6.6</text>

  <!-- Real response (slower, arrives too late) -->
  <line x1="490" y1="300" x2="385" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="437" y="313" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#999">Echte Antwort (zu spät)</text>

  <!-- Poisoned cache -->
  <rect x="690" y="260" width="140" height="60" rx="6" fill="#fdf2f2" stroke="#e2001a" stroke-width="1.5"/>
  <text x="760" y="283" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#c0392b">Cache (vergiftet!)</text>
  <text x="760" y="303" text-anchor="middle" font-family="Segoe UI,monospace" font-size="10" fill="#e2001a">bank.de → 6.6.6.6</text>
  <line x1="380" y1="290" x2="685" y2="290" stroke="#e2001a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Result: Client gets fake IP -->
  <line x1="245" y1="300" x2="140" y2="300" stroke="#e2001a" stroke-width="1.5" marker-end="url(#arr10r)"/>
  <text x="192" y="315" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#e2001a">6.6.6.6 (Fake!)</text>

  <!-- Bottom bar -->
  <rect x="30" y="445" width="840" height="40" rx="6" fill="#34495e"/>
  <text x="60" y="463" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#fff">Schutz:</text>
  <text x="110" y="463" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#ecf0f1">DNSSEC (kryptografische Signatur)</text>
  <text x="355" y="463" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#ecf0f1">DNS over HTTPS (DoH)</text>
  <text x="540" y="463" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#ecf0f1">DNS over TLS (DoT)</text>
  <text x="710" y="463" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#ecf0f1">Source Port Randomization</text>
  <text x="60" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#95a5a6">Kaminsky Attack (2008): Dan Kaminsky zeigte, dass DNS Cache Poisoning in Sekunden möglich ist → Auslöser für DNSSEC-Adoption</text>
</svg>