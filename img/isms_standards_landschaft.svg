<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background layer: EU-Regulatorik -->
  <rect x="20" y="20" width="760" height="440" rx="18" fill="#f0f0f0" stroke="#ccc" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="#666">EU-Regulatorik &amp; nationale Gesetzgebung</text>

  <!-- NIS2 block (left) -->
  <rect x="50" y="75" width="220" height="180" rx="12" fill="white" stroke="#e2001a" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="50" y="75" width="220" height="40" rx="12" fill="#e2001a"/>
  <rect x="50" y="100" width="220" height="15" fill="#e2001a"/>
  <text x="160" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="white">NIS2-Richtlinie</text>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#555">Meldepflichten</text>
  <text x="160" y="158" text-anchor="middle" font-size="12" fill="#555">Governance-Pflichten</text>
  <text x="160" y="176" text-anchor="middle" font-size="12" fill="#555">Sanktionen</text>
  <text x="160" y="194" text-anchor="middle" font-size="12" fill="#555">Supply-Chain-Security</text>
  <text x="160" y="218" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Verbindlich (EU)</text>
  <text x="160" y="240" text-anchor="middle" font-size="11" fill="#888" font-style="italic">DE: NIS2UmsuCG</text>

  <!-- ISO 27001 block (center) -->
  <rect x="290" y="75" width="220" height="250" rx="12" fill="white" stroke="#c4161c" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="290" y="75" width="220" height="40" rx="12" fill="#c4161c"/>
  <rect x="290" y="100" width="220" height="15" fill="#c4161c"/>
  <text x="400" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="white">ISO/IEC 27001</text>
  <text x="400" y="138" text-anchor="middle" font-size="12" fill="#555">ISMS-Anforderungen</text>
  <text x="400" y="156" text-anchor="middle" font-size="12" fill="#555">Anhang A Controls (93)</text>
  <text x="400" y="174" text-anchor="middle" font-size="12" fill="#555">Risikomanagement</text>
  <text x="400" y="192" text-anchor="middle" font-size="12" fill="#555">Zertifizierung möglich</text>
  <text x="400" y="225" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Internationaler Standard</text>
  <text x="400" y="243" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Freiwillig, weltweit anerkannt</text>

  <!-- Sub-standards -->
  <rect x="300" y="268" width="90" height="44" rx="6" fill="#f5f5f5" stroke="#c4161c" stroke-width="1.5"/>
  <text x="345" y="290" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">27002</text>
  <text x="345" y="304" text-anchor="middle" font-size="9" fill="#888">Maßnahmen</text>

  <rect x="400" y="268" width="90" height="44" rx="6" fill="#f5f5f5" stroke="#c4161c" stroke-width="1.5"/>
  <text x="445" y="290" text-anchor="middle" font-size="10" font-weight="bold" fill="#555">27005</text>
  <text x="445" y="304" text-anchor="middle" font-size="9" fill="#888">Risiko</text>

  <!-- BSI IT-Grundschutz block (right) -->
  <rect x="530" y="75" width="220" height="250" rx="12" fill="white" stroke="#555" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="530" y="75" width="220" height="40" rx="12" fill="#555"/>
  <rect x="530" y="100" width="220" height="15" fill="#555"/>
  <text x="640" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="white">BSI IT-Grundschutz</text>
  <text x="640" y="138" text-anchor="middle" font-size="12" fill="#555">BSI-Standards 200-x</text>
  <text x="640" y="156" text-anchor="middle" font-size="12" fill="#555">Bausteinmodell</text>
  <text x="640" y="174" text-anchor="middle" font-size="12" fill="#555">Schutzbedarfsfeststellung</text>
  <text x="640" y="192" text-anchor="middle" font-size="12" fill="#555">Zertifizierung möglich</text>
  <text x="640" y="225" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Deutscher Standard</text>
  <text x="640" y="243" text-anchor="middle" font-size="11" fill="#888" font-style="italic">Praxisorientiert, detailliert</text>

  <!-- Sub-items BSI -->
  <rect x="540" y="268" width="90" height="44" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text x="585" y="285" text-anchor="middle" font-size="9" font-weight="bold" fill="#555">Kompendium</text>
  <text x="585" y="300" text-anchor="middle" font-size="9" fill="#888">Bausteine</text>

  <rect x="640" y="268" width="90" height="44" rx="6" fill="#f5f5f5" stroke="#555" stroke-width="1.5"/>
  <text x="685" y="285" text-anchor="middle" font-size="9" font-weight="bold" fill="#555">KRITIS</text>
  <text x="685" y="300" text-anchor="middle" font-size="9" fill="#888">Nachweise</text>

  <!-- DSGVO bar (bottom) -->
  <rect x="50" y="380" width="700" height="60" rx="10" fill="white" stroke="#888" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="408" text-anchor="middle" font-size="15" font-weight="bold" fill="#555">DSGVO / GDPR</text>
  <text x="400" y="428" text-anchor="middle" font-size="12" fill="#888">Datenschutzanforderungen – Schnittstellen zu allen ISMS-Frameworks</text>

  <!-- Connecting arrows -->
  <!-- NIS2 → ISO -->
  <line x1="270" y1="160" x2="290" y2="160" stroke="#ddd" stroke-width="2" stroke-dasharray="5,3"/>
  <!-- ISO ↔ BSI -->
  <line x1="510" y1="160" x2="530" y2="160" stroke="#ddd" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Labels on connections -->
  <text x="280" y="148" text-anchor="middle" font-size="9" fill="#aaa" transform="rotate(-90, 280, 148)">fordert</text>
  <text x="520" y="148" text-anchor="middle" font-size="9" fill="#aaa" transform="rotate(-90, 520, 148)">kompatibel</text>
</svg>