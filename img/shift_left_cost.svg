<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <defs>
    <linearGradient id="costGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#276749"/>
      <stop offset="40%" stop-color="#e8a520"/>
      <stop offset="100%" stop-color="#e2001a"/>
    </linearGradient>
  </defs>

  <!-- Axes -->
  <line x1="80" y1="330" x2="660" y2="330" stroke="#444" stroke-width="2"/>
  <line x1="80" y1="330" x2="80" y2="40" stroke="#444" stroke-width="2"/>

  <!-- Y-axis label -->
  <text x="30" y="185" text-anchor="middle" fill="#444" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" transform="rotate(-90, 30, 185)">Kosten der Fehlerbehebung</text>

  <!-- X-axis label -->
  <text x="370" y="385" text-anchor="middle" fill="#444" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">SSDLC-Phase</text>

  <!-- Exponential curve path -->
  <path d="M 120 315 C 180 312, 260 305, 330 290 C 400 270, 460 220, 510 150 C 540 100, 580 65, 620 50" fill="none" stroke="url(#costGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Area under curve (subtle fill) -->
  <path d="M 120 315 C 180 312, 260 305, 330 290 C 400 270, 460 220, 510 150 C 540 100, 580 65, 620 50 L 620 330 L 120 330 Z" fill="url(#costGrad)" opacity="0.08"/>

  <!-- Phase markers on X-axis -->
  <!-- Design -->
  <line x1="120" y1="330" x2="120" y2="335" stroke="#444" stroke-width="2"/>
  <text x="120" y="352" text-anchor="middle" fill="#444" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Design</text>

  <!-- Implementation -->
  <line x1="260" y1="330" x2="260" y2="335" stroke="#444" stroke-width="2"/>
  <text x="260" y="352" text-anchor="middle" fill="#444" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Implement.</text>

  <!-- Testing -->
  <line x1="400" y1="330" x2="400" y2="335" stroke="#444" stroke-width="2"/>
  <text x="400" y="352" text-anchor="middle" fill="#444" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Testing</text>

  <!-- Release -->
  <line x1="510" y1="330" x2="510" y2="335" stroke="#444" stroke-width="2"/>
  <text x="510" y="352" text-anchor="middle" fill="#444" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Release</text>

  <!-- Produktion -->
  <line x1="620" y1="330" x2="620" y2="335" stroke="#444" stroke-width="2"/>
  <text x="620" y="352" text-anchor="middle" fill="#444" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">Produktion</text>

  <!-- Data points with cost factors -->
  <!-- Design: 1x -->
  <circle cx="120" cy="315" r="6" fill="#276749"/>
  <rect x="82" y="283" width="76" height="24" rx="12" fill="#276749"/>
  <text x="120" y="299" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">1x</text>

  <!-- Implementation: 6x -->
  <circle cx="260" cy="305" r="6" fill="#5a8a3c"/>
  <rect x="222" y="273" width="76" height="24" rx="12" fill="#5a8a3c"/>
  <text x="260" y="289" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">6x</text>

  <!-- Testing: 15x -->
  <circle cx="400" cy="262" r="6" fill="#e8a520"/>
  <rect x="362" y="230" width="76" height="24" rx="12" fill="#e8a520"/>
  <text x="400" y="246" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">15x</text>

  <!-- Release: 100x -->
  <circle cx="510" cy="150" r="6" fill="#c53030"/>
  <rect x="472" y="118" width="76" height="24" rx="12" fill="#c53030"/>
  <text x="510" y="134" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">100x</text>

  <!-- Produktion: 1000x -->
  <circle cx="620" cy="50" r="6" fill="#e2001a"/>
  <rect x="572" y="18" width="86" height="24" rx="12" fill="#e2001a"/>
  <text x="615" y="34" text-anchor="middle" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">1.000x</text>

  <!-- Shift Left Arrow -->
  <path d="M 550 370 L 160 370" fill="none" stroke="#1c3f6e" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="160,365 145,370 160,375" fill="#1c3f6e"/>
  <text x="355" y="366" text-anchor="middle" fill="#1c3f6e" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">← Shift Left = Kosten sparen</text>
</svg>