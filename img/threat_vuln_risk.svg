<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Threat circle -->
  <circle cx="240" cy="170" r="130" fill="#e2001a" fill-opacity="0.15" stroke="#e2001a" stroke-width="2"/>
  <text x="155" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e2001a">Bedrohung</text>
  <text x="155" y="112" font-family="Arial, sans-serif" font-size="10" fill="#666">(Threat)</text>
  <text x="140" y="140" font-family="Arial, sans-serif" font-size="10" fill="#555">• Ransomware</text>
  <text x="140" y="155" font-family="Arial, sans-serif" font-size="10" fill="#555">• Phishing</text>
  <text x="140" y="170" font-family="Arial, sans-serif" font-size="10" fill="#555">• Insider</text>

  <!-- Vulnerability circle -->
  <circle cx="380" cy="170" r="130" fill="#1c3f6e" fill-opacity="0.15" stroke="#1c3f6e" stroke-width="2"/>
  <text x="420" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1c3f6e">Schwachstelle</text>
  <text x="420" y="112" font-family="Arial, sans-serif" font-size="10" fill="#666">(Vulnerability)</text>
  <text x="420" y="140" font-family="Arial, sans-serif" font-size="10" fill="#555">• Buffer Overflow</text>
  <text x="420" y="155" font-family="Arial, sans-serif" font-size="10" fill="#555">• Fehlkonfiguration</text>
  <text x="420" y="170" font-family="Arial, sans-serif" font-size="10" fill="#555">• Schwaches Passwort</text>

  <!-- Overlap area = Risk -->
  <text x="310" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#b71c1c">Risiko</text>
  <text x="310" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#b71c1c">(Risk)</text>

  <!-- Asset box below -->
  <g filter="url(#shadow)">
    <rect x="230" y="310" width="160" height="50" rx="8" fill="#2e7d32"/>
    <text x="310" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Asset</text>
    <text x="310" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" fill-opacity="0.85">Schützenswertes Gut</text>
  </g>

  <!-- Arrow from Asset to overlap -->
  <line x1="310" y1="310" x2="310" y2="225" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="325" y="270" font-family="Arial, sans-serif" font-size="9" fill="#2e7d32">exponiert</text>

  <!-- Formula box -->
  <g filter="url(#shadow)">
    <rect x="420" y="310" width="250" height="50" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
    <text x="545" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Risiko = Eintrittswahrscheinlichkeit</text>
    <text x="545" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">× Schadensausmaß</text>
  </g>
</svg>
