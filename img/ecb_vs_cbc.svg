<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <polygon points="0,1 10,5 0,9" fill="#555"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
  </style>

  <!-- ECB Section -->
  <rect x="10" y="10" width="390" height="360" rx="12" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <rect x="10" y="10" width="390" height="38" rx="12" fill="#c62828"/>
  <rect x="10" y="35" width="390" height="13" fill="#c62828"/>
  <text x="205" y="35" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">ECB – Electronic Codebook ❌</text>

  <!-- ECB Blocks -->
  <rect x="35" y="65" width="80" height="35" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="75" y="87" text-anchor="middle" font-size="10" fill="#0d47a1">Block P₁</text>

  <rect x="155" y="65" width="80" height="35" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="195" y="87" text-anchor="middle" font-size="10" fill="#0d47a1">Block P₂ = P₁</text>

  <rect x="275" y="65" width="80" height="35" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="315" y="87" text-anchor="middle" font-size="10" fill="#0d47a1">Block P₃</text>

  <!-- ECB Encrypt -->
  <rect x="40" y="120" width="70" height="35" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="75" y="142" text-anchor="middle" font-size="10" fill="#c62828" font-weight="bold">AES(K)</text>

  <rect x="160" y="120" width="70" height="35" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="195" y="142" text-anchor="middle" font-size="10" fill="#c62828" font-weight="bold">AES(K)</text>

  <rect x="280" y="120" width="70" height="35" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="315" y="142" text-anchor="middle" font-size="10" fill="#c62828" font-weight="bold">AES(K)</text>

  <!-- ECB Output -->
  <rect x="35" y="175" width="80" height="35" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="75" y="197" text-anchor="middle" font-size="10" fill="#c62828">C₁</text>

  <rect x="155" y="175" width="80" height="35" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="195" y="197" text-anchor="middle" font-size="10" fill="#c62828">C₂ = C₁ !</text>

  <rect x="275" y="175" width="80" height="35" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="315" y="197" text-anchor="middle" font-size="10" fill="#c62828">C₃</text>

  <!-- ECB arrows -->
  <line x1="75" y1="100" x2="75" y2="117" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="195" y1="100" x2="195" y2="117" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="315" y1="100" x2="315" y2="117" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="75" y1="155" x2="75" y2="172" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="195" y1="155" x2="195" y2="172" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="315" y1="155" x2="315" y2="172" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ECB Problem -->
  <rect x="30" y="225" width="350" height="45" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="205" y="243" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">⚠ Gleicher Klartext → Gleicher Geheimtext</text>
  <text x="205" y="260" text-anchor="middle" font-size="10" fill="#555">Muster bleiben erkennbar! (z.B. „ECB-Pinguin")</text>

  <!-- ECB Penguin hint -->
  <rect x="60" y="285" width="120" height="70" rx="6" fill="#eee" stroke="#aaa" stroke-width="1"/>
  <text x="120" y="310" text-anchor="middle" font-size="28">🐧</text>
  <text x="120" y="345" text-anchor="middle" font-size="9" fill="#888">Original</text>

  <rect x="200" y="285" width="120" height="70" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1"/>
  <text x="260" y="310" text-anchor="middle" font-size="28">🐧</text>
  <text x="260" y="330" text-anchor="middle" font-size="9" fill="#c62828">ECB: Konturen</text>
  <text x="260" y="345" text-anchor="middle" font-size="9" fill="#c62828">bleiben sichtbar!</text>

  <!-- CBC Section -->
  <rect x="420" y="10" width="390" height="360" rx="12" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <rect x="420" y="10" width="390" height="38" rx="12" fill="#2e7d32"/>
  <rect x="420" y="35" width="390" height="13" fill="#2e7d32"/>
  <text x="615" y="35" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">CBC – Cipher Block Chaining ✅</text>

  <!-- IV -->
  <rect x="440" y="60" width="65" height="30" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="472" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">IV</text>

  <!-- CBC Blocks -->
  <rect x="440" y="100" width="80" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="480" y="120" text-anchor="middle" font-size="10" fill="#0d47a1">Block P₁</text>

  <rect x="560" y="100" width="80" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="600" y="120" text-anchor="middle" font-size="10" fill="#0d47a1">Block P₂ = P₁</text>

  <rect x="680" y="100" width="80" height="30" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="720" y="120" text-anchor="middle" font-size="10" fill="#0d47a1">Block P₃</text>

  <!-- XOR nodes -->
  <circle cx="480" cy="155" r="14" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="480" y="160" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">⊕</text>

  <circle cx="600" cy="155" r="14" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="600" y="160" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">⊕</text>

  <circle cx="720" cy="155" r="14" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="720" y="160" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">⊕</text>

  <!-- CBC Encrypt -->
  <rect x="445" y="185" width="70" height="35" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="480" y="207" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">AES(K)</text>

  <rect x="565" y="185" width="70" height="35" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="207" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">AES(K)</text>

  <rect x="685" y="185" width="70" height="35" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="720" y="207" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">AES(K)</text>

  <!-- CBC Output -->
  <rect x="440" y="240" width="80" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="480" y="260" text-anchor="middle" font-size="10" fill="#2e7d32">C₁</text>

  <rect x="560" y="240" width="80" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="260" text-anchor="middle" font-size="10" fill="#2e7d32">C₂ ≠ C₁</text>

  <rect x="680" y="240" width="80" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="720" y="260" text-anchor="middle" font-size="10" fill="#2e7d32">C₃</text>

  <!-- CBC arrows -->
  <line x1="480" y1="130" x2="480" y2="138" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="130" x2="600" y2="138" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="720" y1="130" x2="720" y2="138" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="169" x2="480" y2="182" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="169" x2="600" y2="182" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="720" y1="169" x2="720" y2="182" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="480" y1="220" x2="480" y2="237" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="600" y1="220" x2="600" y2="237" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="720" y1="220" x2="720" y2="237" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- IV to XOR -->
  <line x1="480" y1="90" x2="480" y2="100" stroke="#f9a825" stroke-width="1.5"/>

  <!-- Chaining arrows -->
  <path d="M520,255 L560,255 L560,175 L586,155" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M640,255 L680,255 L680,175 L706,155" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CBC Advantage -->
  <rect x="435" y="285" width="360" height="45" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="615" y="303" text-anchor="middle" font-size="11" fill="#1b5e20" font-weight="bold">✅ Gleicher Klartext → Anderer Geheimtext</text>
  <text x="615" y="320" text-anchor="middle" font-size="10" fill="#555">XOR-Verkettung + zufälliger IV zerstören Muster</text>

  <!-- CBC Penguin -->
  <rect x="470" y="340" width="120" height="24" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="530" y="357" text-anchor="middle" font-size="10" fill="#2e7d32">🐧 → Rauschen ✓</text>
</svg>