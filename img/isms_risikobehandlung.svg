<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Box 1: Vermeiden -->
  <rect x="30" y="30" width="330" height="160" rx="12" fill="#e2001a" filter="url(#shadow)"/>
  <text x="195" y="72" text-anchor="middle" font-size="22" font-weight="bold" fill="white">Vermeiden</text>
  <line x1="80" y1="85" x2="310" y2="85" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <text x="195" y="112" text-anchor="middle" font-size="14" fill="white">Risikoquelle beseitigen oder</text>
  <text x="195" y="132" text-anchor="middle" font-size="14" fill="white">risikobehaftete Aktivität einstellen</text>
  <text x="195" y="165" text-anchor="middle" font-size="12" fill="white" font-style="italic">z. B. Verzicht auf unsichere Software</text>

  <!-- Box 2: Reduzieren/Mitigieren -->
  <rect x="390" y="30" width="330" height="160" rx="12" fill="#c4161c" filter="url(#shadow)"/>
  <text x="555" y="72" text-anchor="middle" font-size="22" font-weight="bold" fill="white">Reduzieren</text>
  <line x1="440" y1="85" x2="670" y2="85" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <text x="555" y="112" text-anchor="middle" font-size="14" fill="white">Eintrittswahrscheinlichkeit oder</text>
  <text x="555" y="132" text-anchor="middle" font-size="14" fill="white">Auswirkung verringern</text>
  <text x="555" y="165" text-anchor="middle" font-size="12" fill="white" font-style="italic">z. B. Firewall, Verschlüsselung, Schulung</text>

  <!-- Box 3: Transferieren -->
  <rect x="30" y="220" width="330" height="160" rx="12" fill="#888" filter="url(#shadow)"/>
  <text x="195" y="262" text-anchor="middle" font-size="22" font-weight="bold" fill="white">Transferieren</text>
  <line x1="80" y1="275" x2="310" y2="275" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <text x="195" y="302" text-anchor="middle" font-size="14" fill="white">Risiko an Dritte übertragen</text>
  <text x="195" y="322" text-anchor="middle" font-size="14" fill="white">(finanziell oder operativ)</text>
  <text x="195" y="355" text-anchor="middle" font-size="12" fill="white" font-style="italic">z. B. Cyberversicherung, Outsourcing</text>

  <!-- Box 4: Akzeptieren -->
  <rect x="390" y="220" width="330" height="160" rx="12" fill="#555" filter="url(#shadow)"/>
  <text x="555" y="262" text-anchor="middle" font-size="22" font-weight="bold" fill="white">Akzeptieren</text>
  <line x1="440" y1="275" x2="670" y2="275" stroke="white" stroke-opacity="0.3" stroke-width="1"/>
  <text x="555" y="302" text-anchor="middle" font-size="14" fill="white">Risiko bewusst eingehen</text>
  <text x="555" y="322" text-anchor="middle" font-size="14" fill="white">(dokumentierte Entscheidung)</text>
  <text x="555" y="355" text-anchor="middle" font-size="12" fill="white" font-style="italic">z. B. geringes Restrisiko nach Analyse</text>
</svg>